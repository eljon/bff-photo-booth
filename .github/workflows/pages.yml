name: Guest preview → GitHub Pages

# Builds a single self-contained HTML preview of the guest app from the latest
# source and publishes it to GitHub Pages, so the newest guest experience is
# always visible at a stable URL — no terminal, no booth. Printing is disabled
# in the preview (that needs the booth Mac); everything else runs client-side.

on:
  push:
    branches:
      - main
      - claude/photo-booth-mobile-app-r3duzq
    paths:
      - 'public/**'
      - 'scripts/build-preview.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the static guest preview
        run: node scripts/build-preview.mjs --out _site/index.html
      # Turn Pages on (build type = GitHub Actions) if it is not already, so no
      # manual toggle is needed. Harmless when it is already enabled.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
