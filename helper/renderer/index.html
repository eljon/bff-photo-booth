<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BFF Booth Helper</title>
  <style>
    :root { color-scheme: light dark; --ink: #15111b; --dim: #6b6472; --line: #e3dfe8; --accent: #ff5c7a; --bg: #faf7fb; --card: #fff; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f6f1ef; --dim: #b3a7bd; --line: #2e2c36; --bg: #15111b; --card: #1c1b21; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--bg); padding: 22px; }
    h1 { font-size: 17px; margin: 0 0 2px; }
    p.sub { margin: 0 0 18px; color: var(--dim); }
    label { display: block; font-weight: 600; margin: 14px 0 5px; }
    input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font-size: 15px; }
    input#code { font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.18em; text-transform: uppercase; }
    button { font: inherit; }
    .btn { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
    .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); margin-top: 10px; }
    .status { margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
    .dot.connecting { background: #e8a13a; animation: pulse 1.1s infinite; }
    .dot.connected { background: #35c07a; }
    .dot.error { background: var(--accent); }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .link { color: var(--accent); cursor: pointer; text-decoration: underline; background: none; border: 0; padding: 0; }
    .hint { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Connect this printer</h1>
  <p class="sub">Enter the details from your booth's host screen.</p>

  <label for="relay">Booth web address</label>
  <input id="relay" type="url" placeholder="https://your-booth.onrender.com" autocomplete="off" />

  <label for="code">Pairing code</label>
  <input id="code" maxlength="4" placeholder="XXXX" autocomplete="off" />
  <div class="hint">On the host screen: Printer ▸ “Connect a printer”. The code lasts 10 minutes.</div>

  <button class="btn" id="connect">Connect</button>
  <button class="btn secondary" id="disconnect" hidden>Disconnect</button>

  <div class="status"><span class="dot" id="dot"></span><span id="msg">Not connected</span></div>

  <script src="renderer.js"></script>
</body>
</html>
