<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0c0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Photo Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0f;
  --bg-soft: #16161a;
  --card: #1c1b21;
  --line: #2e2c36;
  --ink: #f6f1ef;
  --ink-dim: #b3a7bd;
  --accent: #ff5c7a;
  --accent-ink: #2a0b13;
  --ok: #5ad1a5;
  --warn: #ffb020;
  --radius: 18px;
  --bar-h: 84px;
  /* the primary CTA / accent gradient, shared by the Print button and the step guide */
  --g3: #ff4d97;
  --grad: linear-gradient(115deg, #6a5cff 0%, #a24bff 32%, #ff4d97 64%, #ff7a4d 100%);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}

body {
  min-height: 100dvh;
  background:
    radial-gradient(120% 60% at 50% 0%, #1a1a20 0%, transparent 60%),
    var(--bg);
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: max(14px, env(safe-area-inset-top)) 16px max(8px, env(safe-area-inset-bottom));
  /* Fill the viewport so the coverflow can flex to take the leftover height —
     that drops the cards into a comfortable thumb zone on tall screens instead
     of pinning them near the top. */
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.topbar { text-align: center; padding: 6px 0 8px; }
.brand {
  display: flex;
  align-items: baseline;
  justify-content: center;
  flex-wrap: nowrap;
  gap: 8px;
}
/* Chunky, rounded, playful wordmark echoing the "Building Forever Families" logo:
   a friendly rounded face in the logo's solid bright orange, with a slight extruded
   bottom edge so it reads like a sticker. Title Case (not shouty caps), tight tracking. */
.topbar h1 {
  margin: 0;
  font-family: "Baloo 2", "Fredoka", system-ui, sans-serif;
  /* Shrink to keep the wordmark and the version tag beside it on one line. */
  font-size: clamp(24px, 8vw, 32px);
  white-space: nowrap;
  line-height: 1.05;
  letter-spacing: 0.005em;
  font-weight: 800;
  color: #ff8a1e;
  text-shadow: 0 2px 0 #d1670c, 0 3px 10px #0008;
}
.topbar p { margin: 6px 0 0; color: var(--ink-dim); font-size: 14px; }

/* ---------------------------------------------------------------- preview */

.stage { display: flex; flex-direction: column; align-items: center; flex: 1 1 auto; min-height: 0; justify-content: center; }

.paper-shadow {
  position: relative;
  padding: 10px;
  border-radius: 10px;
  background: linear-gradient(180deg, #ffffff10, #ffffff05);
  box-shadow: 0 18px 40px -18px #000, 0 0 0 1px var(--line);
}

#preview {
  display: block;
  max-width: min(78vw, 300px);
  max-height: 46vh;
  width: auto;
  height: auto;
  border-radius: 4px;
  background: #fff;
}

.paper-note { color: var(--ink-dim); font-size: 12px; margin: 10px 0 2px; letter-spacing: 0.08em; text-transform: uppercase; }

/* ---------------------------------------------------------------- coverflow */

.coverflow {
  position: relative;
  width: 100%;
  /* Flex to fill the stage's leftover height (bounded), so the cards sit lower on
     tall screens yet still fit short ones. */
  flex: 1 1 auto;
  min-height: 220px;
  max-height: 1000px;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1100px;
  overflow: hidden;
  /* Vertical page scroll is allowed here by default; only the picture cards
     (.cf-card, below) lock it, so touching the reflection or the empty margins
     scrolls the page while a swipe/pinch on a picture does not. */
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* Shared 3D space: cards stack by real depth (translateZ), so as a card nears the
   centre it rises smoothly to the front — the hand-off happens continuously where
   the cards meet, with no hard z-index pop. */
.cf-track {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}

/* Position is driven every frame by JS, so no CSS transition here — it would lag
   behind and fight the animation. No drop shadow: it would sit under the card and
   darken the top of the reflection, opening a fake gap; the mirror grounds it. */
.cf-card {
  position: absolute;
  /* Baseline is a fixed fraction of the container, so every card's bottom edge
     lands on the same line — the "glass". A portrait card is taller than a
     landscape one, but both rest on this line, so their reflections line up.
     Set low so the swipe surface sits in the lower half, within easy thumb reach,
     with a shorter reflection below. */
  top: 84%;
  left: 50%;
  border-radius: 6px;
  /* Scale and rotate pivot about the bottom-centre, so shrinking a side card or
     tilting it keeps its bottom edge pinned to the glass line. */
  transform-origin: 50% 100%;
  /* We own the gesture on a picture — a swipe or pinch here never scrolls the
     page (the container allows vertical scroll everywhere else). */
  touch-action: none;
  will-change: transform, opacity;
  cursor: pointer;
}
/* The canvas is sized in JS to fit a box while keeping the true paper aspect
   (4×6 stays 4×6, 6×4 stays 6×4). No max-width here — that was clamping the
   width while the height stayed, squishing every card toward square. */
.cf-card canvas {
  display: block;
  border-radius: 6px;
  background: #fff;
}
/* Frosted-glass reflection: a separate blurred, faded copy sitting just below
   the card. Unlike -webkit-box-reflect (a crisp mirror = glossy glass), this can
   be blurred, so it reads as a soft, hazy reflection on frosted glass. It is a
   child of the card, so it tilts and recedes in 3D with it. The image is drawn
   pre-flipped in JS; the mask fades it out quickly (short) and it is faint
   (subtle). It never intercepts taps. */
.cf-mirror {
  position: absolute;
  top: 100%;
  left: 0;
  border-radius: 6px;
  pointer-events: none;
  opacity: 0.22;
  filter: blur(3.5px);
  transform-origin: center center; /* a pinch mirrors the paper's transform about here */
  will-change: transform;
  /* Behind the print: when a pinch makes the paper and its reflection overlap,
     the reflection must sit under the picture, not paint over it. */
  z-index: -1;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 38%);
  mask-image: linear-gradient(to bottom, #000 0%, transparent 38%);
}
/* The paper: a pinch scales/rotates/moves this (a view only), around its centre,
   without disturbing the card's coverflow position. It holds both the print face
   and its reflection, so a pinch zooms them together; the container keeps its
   overflow clipping, so the deck's clean left/right edges stay put. */
.cf-paper {
  transform-origin: center center;
  will-change: transform;
}
/* While a pinch is in flight the centred paper is re-parented here — a full-screen,
   unclipped, top-of-everything layer — so the zoomed print floats ABOVE every UI
   control (check button, Replace, queue widget) instead of being clipped by the
   coverflow's overflow and stacked beneath them. The reflection stays behind in the
   card (its original, clipped layer), untouched. */
#pinchLayer {
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  /* Clip to the screen: the print is floated in here as an ABSOLUTE child, so this
     bounds its paint (and its soft shadow) to the viewport. Anything past the edge
     is off-screen anyway, and leaving it unbounded made a big zoom paint an enormous
     area every frame — which froze the pinch on the phone. */
  overflow: hidden;
}
/* ---------------------------------------------------------------- panels */

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 16px;
}

.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.panel-head h2 { margin: 0; font-size: 15px; text-transform: uppercase; letter-spacing: 0.12em; }
.sub { margin: 16px 0 8px; font-size: 12px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
.hint { color: var(--ink-dim); font-size: 13px; line-height: 1.45; margin: 12px 0 0; }

.pill {
  font-size: 12px;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 999px;
  background: #ffffff12;
  color: var(--ink);
}
.pill.quiet { background: transparent; border: 1px solid var(--line); color: var(--ink-dim); font-weight: 500; }
.pill.good { background: #5ad1a520; color: var(--ok); }
.pill.bad { background: #ff5c7a20; color: var(--accent); }

/* ---------------------------------------------------------------- slots */

.pick {
  /* A NEGATIVE top margin overlaps the controls into the coverflow's bottom: the flex
     stage above grows to fill the pulled-up space (so the coverflow gets taller), and
     the check button (z-index below) rides up over the faint tail of the reflection —
     the reflection grounds into the button, while staying clear of the card itself. */
  margin-top: -34px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  position: relative;
  z-index: 5;
}
.hint.problem { color: var(--accent); }

/* "Replace photos" — a bright, standout pill that clearly lifts off the dark
   stage (the old ghost button blended in), and a centred pill rather than a
   full-width bar so it never crowds the sticky action bar below. */
.btn-replace {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 18px 0 4px; /* extra top gap so it clears the Save/Print (or check) above */
  padding: 12px 24px;
  border-radius: 999px;
  background: #ffffff33;
  border: 1px solid #ffffff8c;
  color: #fff;
  font-weight: 700;
  letter-spacing: 0.01em;
  box-shadow: 0 8px 20px #0007;
  backdrop-filter: blur(6px);
}
.btn-replace:active { transform: scale(0.97); }
.btn-replace-ico { font-size: 19px; line-height: 1; }

/* Friendly step-by-step guide that follows the guest: choose photos → swipe a
   layout → print or save. One line at the top of the stage advances 1 → 2; the
   print step appears above the action bar once a layout is on screen. */
.step-guide {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  text-align: center;
  position: relative; /* anchors the confetti bits for the tap-to-commit pop */
}

/* Tap the check → the whole step guide shrinks into nothing, clearing the stage
   for Save/Print. It KEEPS its layout box (no display:none) while shrunk, so the
   coverflow and pictures below never jump up. Same duration as the earlier pop. */
.step-guide.shrinking {
  animation: stepShrink 0.34s ease-in forwards;
  transform-origin: center;
  pointer-events: none;
}
@keyframes stepShrink {
  from { opacity: 1; transform: scale(1); }
  to   { opacity: 0; transform: scale(0); }
}
@media (prefers-reduced-motion: reduce) {
  .step-guide.shrinking { animation: none; opacity: 0; visibility: hidden; }
}
.step-kicker {
  font-family: "Caveat", "Comic Sans MS", cursive;
  font-size: 21px;
  font-weight: 700;
  /* Same moving gradient as the primary button, clipped to the text. The dark
     text-shadow rides behind the glyphs (unaffected by the transparent fill) so
     it stays legible over the print. */
  background: var(--grad);
  background-size: 220% 220%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 8px #000a;
  animation: floatText 3.4s ease-in-out infinite, btnGrad 9s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  .step-kicker { animation: floatText 3.4s ease-in-out infinite; }
}
.step-text {
  font-family: "Caveat", "Comic Sans MS", cursive;
  font-size: 32px;
  line-height: 1.02;
  font-weight: 700;
  color: #fff;
  text-wrap: balance;
  text-shadow: 0 3px 12px #000a, 0 1px 0 #0007;
  animation: floatText 3.4s ease-in-out infinite;
  will-change: transform;
}
.step-hint {
  font-family: "Caveat", "Comic Sans MS", cursive;
  font-size: 19px;
  font-weight: 600;
  color: #ffffffcf;
  text-shadow: 0 2px 8px #000a;
  margin-top: -3px;
  animation: floatText 3.4s ease-in-out infinite 0.3s;
}
/* A miniature of the real check button, dropped inline where the word "check"
   would go, so the guest sees the exact button they need to tap. */
.hint-check {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.35em;
  height: 1.35em;
  vertical-align: -0.28em;
  margin: 0 1px;
  border-radius: 50%;
  color: #fff;
  background: var(--grad);
  background-size: 220% 220%;
  box-shadow: 0 3px 8px -2px #a24bffcc, inset 0 1px 0 #ffffff55;
  text-shadow: none;
  animation: btnGrad 9s ease-in-out infinite;
}
.hint-check svg { width: 68%; height: 68%; }
@media (prefers-reduced-motion: reduce) { .hint-check { animation: none; } }
@keyframes floatText {
  0%, 100% { transform: translateY(0) rotate(-1.2deg); }
  50%      { transform: translateY(-7px) rotate(1.2deg); }
}

/* Hand-drawn arrows that gesture at the button for the current step. Positioned
   over the button's container; the #sketch filter roughens the strokes so they
   read as pencil doodles, and they bob so they catch the eye. */
.doodle {
  position: absolute;
  width: 66px;
  height: 60px;
  overflow: visible;
  pointer-events: none;
  z-index: 8;
}
.doodle path {
  fill: none;
  stroke: #fff;
  stroke-width: 4.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 2px 3px #0009);
}
@keyframes bobArrow {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(8px) rotate(-4deg); }
}
.doodle-pick { animation: bobArrow 2.2s ease-in-out infinite; }
/* Step 1: above the "add photos" button, pointing down at it. */
.doodle-pick { left: calc(50% + 34px); top: calc(50% - 104px); }
.pick-overlay.compact .doodle-pick { display: none; } /* gone once photos are in */
body.is-empty .doodle-pick { top: -58px; left: calc(50% + 22px); }

/* Step 2 swipe cue: a hand-drawn double-headed arrow with a gradient fingertip
   that glides left↔right, so the guest reads "swipe the layouts". Sits between
   the instruction and the coverflow. */
.swipe-hint {
  position: relative;
  width: 150px;
  height: 40px;
  margin: 0 auto 8px;
}
/* After it pops away: invisible but still occupying its fixed-height box, so the
   coverflow and pictures below stay put (never display:none on step 2). */
.swipe-hint.spent { visibility: hidden; }
.swipe-track { display: block; width: 100%; height: 100%; overflow: visible; }
.swipe-track path {
  fill: none;
  stroke: #ffffffde;
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 2px 3px #0009);
}
.swipe-finger {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 24px;
  height: 24px;
  margin: -12px 0 0 -12px;
  border-radius: 50%;
  background: var(--grad);
  background-size: 220% 220%;
  box-shadow: 0 6px 16px -4px #a24bffbb, 0 2px 6px -3px #ff4d97aa;
  animation: swipeSlide 2.4s ease-in-out infinite, btnGrad 9s ease-in-out infinite;
}
@keyframes swipeSlide {
  0%, 100% { transform: translateX(-50px) scale(0.94); }
  50%      { transform: translateX(50px)  scale(1.06); }
}
@media (prefers-reduced-motion: reduce) {
  .swipe-finger { animation: none; }
}

/* First-swipe pop: the arrow and the fingertip burst, and six confetti bits fly
   out radially — the whole cue vanishes with a little celebration. */
.pop-bit {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 9px;
  height: 9px;
  margin: -4.5px 0 0 -4.5px;
  border-radius: 50%;
  background: var(--g3);
  opacity: 0;
  pointer-events: none;
}
.pop-bit:nth-child(odd)  { background: #6a5cff; }
.pop-bit:nth-child(3n)   { background: #ff7a4d; width: 7px; height: 7px; }
.swipe-hint.popping { pointer-events: none; }
.swipe-hint.popping .swipe-finger { animation: popFinger 0.32s ease-out forwards; }
.swipe-hint.popping .swipe-track  { animation: popTrack 0.3s ease-out forwards; }
.swipe-hint.popping .pop-bit      { animation: popBit 0.42s ease-out forwards; }
@keyframes popFinger {
  0%   { transform: scale(1); opacity: 1; }
  35%  { transform: scale(1.7); opacity: 1; }
  100% { transform: scale(0.2); opacity: 0; }
}
@keyframes popTrack {
  0%   { transform: scale(1); opacity: 1; }
  40%  { transform: scale(1.14); opacity: 1; }
  100% { transform: scale(0.6); opacity: 0; }
}
@keyframes popBit {
  0%   { opacity: 0; transform: rotate(var(--a)) translateX(4px)  scale(0.4); }
  30%  { opacity: 1; transform: rotate(var(--a)) translateX(18px) scale(1); }
  100% { opacity: 0; transform: rotate(var(--a)) translateX(44px) scale(0.3); }
}
@media (prefers-reduced-motion: reduce) {
  .swipe-hint.popping .swipe-finger,
  .swipe-hint.popping .swipe-track,
  .swipe-hint.popping .pop-bit { animation: none; }
}

/* At the top of the stage: a little breathing room below the header. In the
   welcome screen it's centred with the button; over the coverflow it sits above. */
.stage > .step-guide { margin: 2px 0 4px; }
/* Extra gap in the welcome screen so the instructions clear the bobbing arrow
   that rises up toward the pick button. */
body.is-empty .stage > .step-guide { margin: 0 0 52px; }

/* The one button lives on top of the print itself, so there is never an empty
   grid sitting next to a button asking to fill it. */
.pick-overlay {
  position: absolute;
  inset: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  border-radius: 4px;
  background: #0c0c0fa6;
  backdrop-filter: blur(1.5px);
  transition: background 0.18s ease;
}
.btn-pick {
  max-width: 100%;
  padding: 15px 22px;
  font-size: 16px;
  white-space: nowrap;
  box-shadow: 0 8px 22px -10px #000c;
}

/* Once the print is full, get out of the way of it. */
.pick-overlay.compact {
  align-items: flex-end;
  justify-content: center;
  background: transparent;
  backdrop-filter: none;
  pointer-events: none;
}
.pick-overlay.compact .btn-pick {
  pointer-events: auto;
  padding: 9px 15px;
  font-size: 13px;
  border-radius: 999px;
  background: #0c0c0fd9;
  color: var(--ink);
  backdrop-filter: blur(6px);
}

/* The opening screen: just the pick button. Strip the placeholder grid card and
   its overlay chrome so nothing frames the button, hide the action bar, and
   centre the button in the stage. */
body.is-empty #preview { display: none; }
body.is-empty .paper-shadow { background: none; box-shadow: none; padding: 0; }
body.is-empty .pick-overlay {
  position: relative; /* anchor the doodle arrow to the button */
  inset: auto;
  padding: 0;
  background: none;
  backdrop-filter: none;
}
body.is-empty .stage { min-height: 56vh; justify-content: center; }

.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }

.slot {
  position: relative;
  aspect-ratio: 3 / 4;
  border-radius: 12px;
  border: 1px dashed var(--line);
  background: var(--bg-soft);
  color: var(--ink-dim);
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 0;
  cursor: pointer;
  opacity: 0.7;
  -webkit-tap-highlight-color: transparent;
}
.slot.filled { opacity: 1; }
.slot canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.slot:disabled { cursor: default; font-size: 13px; font-weight: 700; opacity: 0.45; }
.slot.filled { border-style: solid; border-color: transparent; }
.slot .num {
  position: absolute;
  left: 5px;
  top: 4px;
  font-size: 10px;
  font-weight: 800;
  background: #00000090;
  color: #fff;
  border-radius: 6px;
  padding: 2px 5px;
}

/* ------------------------------------------------------- forms (host page) */

.text-input {
  width: 100%;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-soft);
  color: var(--ink);
  padding: 13px 14px;
  font-size: 16px;
  font-family: inherit;
}
.text-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------------------------------------------------------------- buttons */

.btn {
  border: 0;
  border-radius: 14px;
  padding: 15px 18px;
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn:disabled { opacity: 0.45; cursor: default; }
/* Modern multi-colour gradient CTA — a living violet→fuchsia→coral blend that
   slowly drifts, replacing the flat pink. White text with a faint shadow keeps
   it legible across every stop, and the glow is tinted to match. */
.btn-primary {
  color: #fff;
  text-shadow: 0 1px 2px #0000005c;
  background: var(--grad);
  background-size: 220% 220%;
  box-shadow: 0 10px 26px -8px #a24bffaa, 0 4px 12px -6px #ff4d97aa;
  animation: btnGrad 9s ease-in-out infinite;
}
.btn-primary:disabled { animation: none; }
@keyframes btnGrad {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
@media (prefers-reduced-motion: reduce) {
  .btn-primary { animation: none; }
}
.btn-ghost { background: #ffffff12; color: var(--ink); }
.btn-ghost.danger { color: var(--accent); }
.btn-add { width: 100%; margin-top: 14px; background: #ffffff12; color: var(--ink); }
.btn-icon { font-weight: 800; }
.wide { width: 100%; margin-top: 12px; }

.version { color: var(--ink-dim); font-size: 11px; letter-spacing: 0.08em; margin: 0; }

/* A quiet version stamp inline beside the title (baseline-aligned), shrinking with it. */
.app-version {
  flex: none;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--ink-dim);
  opacity: 0.6;
}
.app-version:empty { display: none; }

/* Print-code (voucher) prompt. It must sit ABOVE the "Sending…" result overlay and the
   queue widget, so a rejected-code re-prompt is never hidden behind them. */
#codeSheet { z-index: 90; align-items: center; padding: 20px; }
.code-card { max-width: 380px; margin: auto; text-align: center; padding: 22px 20px; }
.code-title { margin: 0 0 6px; font-size: 20px; }
.code-note { margin: 0 0 16px; color: var(--ink-dim); font-size: 14px; }
.code-input {
  width: 100%; box-sizing: border-box; text-align: center;
  font: 700 30px/1.1 ui-monospace, "SFMono-Regular", Menlo, monospace;
  letter-spacing: 0.28em; text-transform: uppercase;
  padding: 14px 12px; border-radius: 14px;
  background: #0f0e13; color: var(--ink); border: 1px solid #3a3745;
}
.code-input:focus { outline: none; border-color: var(--accent); }
.code-input.bad { border-color: #ff5c7a; background: #2a1016; animation: codeShake 0.4s; }
@keyframes codeShake {
  10%, 90% { transform: translateX(-2px); }
  20%, 80% { transform: translateX(4px); }
  30%, 50%, 70% { transform: translateX(-8px); }
  40%, 60% { transform: translateX(8px); }
}
@media (prefers-reduced-motion: reduce) { .code-input.bad { animation: none; } }
.code-err { min-height: 20px; margin: 10px 0 0; color: #ff7d97; font-size: 14px; font-weight: 700; }
.code-actions { display: flex; gap: 10px; margin-top: 16px; }
.code-actions .btn { flex: 1; }
.spacer { height: calc(env(safe-area-inset-bottom) + 14px); }

/* ------------------------------------------------------------- commit control
   A check button that, when tapped, splits into Save (left) and Print (right).
   The colour lives in a gooey blob layer (#goo filter) so the shapes fuse into
   liquid and pull apart with a stretching, pinching neck — like splitting slime.
   The crisp icon and labels ride on top, unfiltered. */
.commit {
  position: relative;
  width: 100%;
  max-width: 420px;
  height: 72px;
  z-index: 5; /* sits above the coverflow reflection it overlaps */
}
.commit-ease { transition: transform 0.55s cubic-bezier(0.34, 1.3, 0.5, 1), opacity 0.3s ease; }

/* the slime layer. The expensive metaball goo filter (a big blur) is applied ONLY
   while the split is animating — at rest it's just a cheap drop-shadow, so it
   never taxes the intro coverflow animation that plays as photos come in. The two
   blobs sit perfectly overlapped when closed, so they read as one pill either way. */
/* THE real cut-off fix: the goo is a native inline <svg>, not an HTML element with a
   CSS url(#goo) filter. Safari clips a CSS reference filter to the HTML element's own
   box (it ignores the filter-region), which sliced the blobs flat no matter how the
   box or the blob layers were sized — four different HTML tricks couldn't beat it. An
   SVG element's filter, by contrast, honours its filter region and — with the <svg>
   set to overflow:visible — paints freely OUTSIDE the element's bounds. So the metaball
   blur and the pills' rounded ends can extend past the box exactly as they need to. */
.commit-goo {
  position: absolute;
  left: 0;
  right: 0;
  top: -64px;
  bottom: -64px;
  width: 100%;
  overflow: visible;          /* let the goo spill past the svg box, uncut */
  z-index: 0;
  pointer-events: none;       /* purely decorative — never intercept taps */
}
/* The metaball filter rides the <g> (an SVG element, so its region is honoured). At
   rest it's just a cheap drop shadow; the expensive blur is added only while the split
   animates, so it never taxes the intro coverflow sweep. */
.goo-g { filter: url(#gooRest); }
.commit.animating .goo-g { filter: url(#goo); }
/* The blobs are now <rect>s. transform-box:fill-box makes their % transforms resolve
   against each rect's own box, so the same translate/scale maths as before still
   apply; their x/y/width/height are set in px by layoutGoo() so they line up exactly
   with the (responsive) Save/Print labels on top. */
.blob {
  transform-box: fill-box;
  transform-origin: center;
}
.b-center { fill: url(#gradCenter); transition: transform 0.28s ease, opacity 0.24s ease; }
.b-save   { fill: url(#gradSave);  opacity: 0; transform: translateX(calc(50% + 24px)) scaleX(0.46); }
.b-print  { fill: url(#gradPrint); opacity: 0; transform: translateX(calc(-50% - 24px)) scaleX(0.46); }
/* Open: centre circle shrinks away; the two blobs light up. The RESTING open pose
   is a plain rule (not animation fill-mode) so a repaint or reflow — e.g. a
   coverflow swipe on Safari — can never drop the pair back to the check circle. */
.commit.open .b-center { transform: scale(0.2); opacity: 0; }
.commit.open .b-save,
.commit.open .b-print { opacity: 1; transform: translateX(0) scaleX(1) scaleY(1); }

/* Open: the two circles pull apart at once — the goo filter draws a real liquid
   neck between them that stretches and pinches. Once apart, each unsqueezes from a
   circle into the full pill with an elastic overshoot + squash-and-stretch jiggle,
   so it reads as inflating out of the slime. */
@keyframes gooBirthLeft {
  0%   { transform: translateX(calc(50% + 24px)) scaleX(0.46) scaleY(1);
         animation-timing-function: cubic-bezier(0.42, 0, 0.6, 0.5); } /* moves off promptly */
  44%  { transform: translateX(0) scaleX(0.46) scaleY(1.05);
         animation-timing-function: cubic-bezier(0.3, 1.5, 0.5, 1); }  /* arrived, round, about to inflate */
  62%  { transform: translateX(0) scaleX(1.1)  scaleY(0.84); }         /* inflate wide, squash */
  80%  { transform: translateX(0) scaleX(0.96) scaleY(1.07); }         /* rebound tall */
  91%  { transform: translateX(0) scaleX(1.02) scaleY(0.98); }         /* settle jiggle */
  100% { transform: translateX(0) scaleX(1)    scaleY(1); }
}
@keyframes gooBirthRight {
  0%   { transform: translateX(calc(-50% - 24px)) scaleX(0.46) scaleY(1);
         animation-timing-function: cubic-bezier(0.42, 0, 0.6, 0.5); }
  44%  { transform: translateX(0) scaleX(0.46) scaleY(1.05);
         animation-timing-function: cubic-bezier(0.3, 1.5, 0.5, 1); }
  62%  { transform: translateX(0) scaleX(1.1)  scaleY(0.84); }
  80%  { transform: translateX(0) scaleX(0.96) scaleY(1.07); }
  91%  { transform: translateX(0) scaleX(1.02) scaleY(0.98); }
  100% { transform: translateX(0) scaleX(1)    scaleY(1); }
}
/* The gooey split plays only while `.animating` (the ~0.9s after the tap); after
   that the plain `.commit.open` pose above holds the pills in place. */
.commit.animating:not(.closing) .b-save  { animation: gooBirthLeft 0.82s forwards; }
.commit.animating:not(.closing) .b-print { animation: gooBirthRight 0.82s forwards; }

/* Reverse: swiping to a new design merges Save/Print back into the check. The
   pills deflate to circles, slide together (the goo re-forms a neck and fuses
   them), the centre circle grows back and the tick fades in. */
@keyframes gooMergeLeft {
  0%   { transform: translateX(0) scaleX(1) scaleY(1); }
  44%  { transform: translateX(0) scaleX(0.46) scaleY(1); }
  100% { transform: translateX(calc(50% + 24px)) scaleX(0.46) scaleY(1); }
}
@keyframes gooMergeRight {
  0%   { transform: translateX(0) scaleX(1) scaleY(1); }
  44%  { transform: translateX(0) scaleX(0.46) scaleY(1); }
  100% { transform: translateX(calc(-50% - 24px)) scaleX(0.46) scaleY(1); }
}
@keyframes centerBack { 0%, 52% { transform: scale(0.25); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes checkBack  { 0%, 60% { opacity: 0; } 100% { opacity: 1; } }
.commit.closing .b-save   { animation: gooMergeLeft  0.68s cubic-bezier(0.5, 0, 0.4, 1) forwards; }
.commit.closing .b-print  { animation: gooMergeRight 0.68s cubic-bezier(0.5, 0, 0.4, 1) forwards; }
.commit.closing .b-center { animation: centerBack 0.68s forwards; }
.commit.closing .check-btn { animation: checkBack 0.68s forwards; }
.commit.closing .commit-pair { pointer-events: none; }

/* The labels carry the SAME horizontal travel as their blob so they ride with the
   button (they fade in once the pill is wide enough for the text, fade out as it
   deflates). */
@keyframes labelBirthLeft {
  0%   { transform: translateX(calc(50% + 24px)); opacity: 0;
         animation-timing-function: cubic-bezier(0.42, 0, 0.6, 0.5); }
  44%  { transform: translateX(0); opacity: 0; }
  70%  { opacity: 1; }
  100% { transform: translateX(0); opacity: 1; }
}
@keyframes labelBirthRight {
  0%   { transform: translateX(calc(-50% - 24px)); opacity: 0;
         animation-timing-function: cubic-bezier(0.42, 0, 0.6, 0.5); }
  44%  { transform: translateX(0); opacity: 0; }
  70%  { opacity: 1; }
  100% { transform: translateX(0); opacity: 1; }
}
@keyframes labelMergeLeft {
  0%   { transform: translateX(0); opacity: 1; }
  20%  { opacity: 0; }
  44%  { transform: translateX(0); opacity: 0; }
  100% { transform: translateX(calc(50% + 24px)); opacity: 0; }
}
@keyframes labelMergeRight {
  0%   { transform: translateX(0); opacity: 1; }
  20%  { opacity: 0; }
  44%  { transform: translateX(0); opacity: 0; }
  100% { transform: translateX(calc(-50% - 24px)); opacity: 0; }
}

/* crisp overlays */
.check-btn {
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  /* A circle exactly over the goo circle, clipping its contents — so when the tick
     flies toward the swipe it slides out past this edge and vanishes, never showing
     outside the button. */
  width: 72px;
  height: 72px;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  border: 0;
  background: none;
  color: #fff;
  cursor: pointer;
  z-index: 2;
  transition: opacity 0.2s ease;
}
.check-btn svg { display: block; filter: drop-shadow(0 1px 1px #0006); }

/* Swipe pop: while the coverflow is in motion the whole check button (the gradient
   circle AND its tick) shrinks away with a little burst, then springs back once the
   deck settles. Scoped away from the open/animating/closing states so it never fights
   the gooey Save/Print split. The tick keeps its centring translateX(-50%). */
@keyframes checkPopOut  { 0% { transform: scale(1); } 26% { transform: scale(1.22); } 100% { transform: scale(0); } }
@keyframes checkPopIn   { 0% { transform: scale(0); } 62% { transform: scale(1.16); } 100% { transform: scale(1); } }
@keyframes checkTickOut { 0% { transform: translateX(-50%) scale(1); } 26% { transform: translateX(-50%) scale(1.22); } 100% { transform: translateX(-50%) scale(0); } }
@keyframes checkTickIn  { 0% { transform: translateX(-50%) scale(0); } 62% { transform: translateX(-50%) scale(1.16); } 100% { transform: translateX(-50%) scale(1); } }
.commit.check-out:not(.open):not(.animating):not(.closing) .b-center  { animation: checkPopOut  0.26s ease-in forwards; }
.commit.check-out:not(.open):not(.animating):not(.closing) .check-btn { animation: checkTickOut 0.26s ease-in forwards; }
.commit.check-in:not(.open):not(.animating):not(.closing)  .b-center  { animation: checkPopIn  0.44s cubic-bezier(0.3, 1.5, 0.5, 1) forwards; }
.commit.check-in:not(.open):not(.animating):not(.closing)  .check-btn { animation: checkTickIn 0.44s cubic-bezier(0.3, 1.5, 0.5, 1) forwards; }

/* Confetti bits that burst radially out of the check as it pops away — the same
   celebratory pop as the swipe cue, so the button breaks into several pieces. */
.cbit {
  position: absolute;
  top: 36px; /* the check circle's centre within the 72px-tall commit */
  left: 50%;
  width: 12px;
  height: 12px;
  margin: -6px 0 0 -6px;
  border-radius: 50%;
  background: var(--g3);
  box-shadow: 0 2px 6px -1px #0007;
  opacity: 0;
  pointer-events: none;
  z-index: 3;
}
.cbit:nth-child(odd) { background: #6a5cff; }
.cbit:nth-child(3n)  { background: #ff7a4d; width: 9px; height: 9px; }
.commit.check-out:not(.open):not(.animating):not(.closing) .cbit { animation: cbitBurst 0.5s ease-out forwards; }
@keyframes cbitBurst {
  0%   { opacity: 0; transform: rotate(var(--a)) translateX(6px)  scale(0.4); }
  25%  { opacity: 1; transform: rotate(var(--a)) translateX(26px) scale(1); }
  60%  { opacity: 1; transform: rotate(var(--a)) translateX(44px) scale(0.9); }
  100% { opacity: 0; transform: rotate(var(--a)) translateX(58px) scale(0.3); }
}
@media (prefers-reduced-motion: reduce) {
  .commit.check-out .b-center, .commit.check-out .check-btn,
  .commit.check-in .b-center,  .commit.check-in .check-btn,
  .commit.check-out .cbit { animation: none; }
}

.commit-pair {
  position: absolute;
  inset: 0;
  display: flex;
  gap: 48px;
  z-index: 2;
  pointer-events: none;
}
.commit-pair button {
  flex: 1;
  height: 72px;
  border: 0;
  border-radius: 20px;
  background: none;
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  color: #fff;
  text-shadow: 0 1px 2px #0000005c;
  will-change: transform, opacity;
}
.commit-save { color: var(--ink); text-shadow: none; }

/* Each label rides ITS blob: it carries the exact same horizontal travel as the
   blob (translate only — no scale, so the text stays crisp), so it moves out of
   the check with the button and back into it, instead of popping in place. */
.commit-save  { transform: translateX(calc(50% + 24px)); opacity: 0; }
.commit-print { transform: translateX(calc(-50% - 24px)); opacity: 0; }
.commit.open .commit-save,
.commit.open .commit-print { transform: translateX(0); opacity: 1; }
.commit.open .commit-pair { pointer-events: auto; }
.commit.animating:not(.closing) .commit-save  { animation: labelBirthLeft  0.82s forwards; }
.commit.animating:not(.closing) .commit-print { animation: labelBirthRight 0.82s forwards; }
.commit.closing .commit-save  { animation: labelMergeLeft  0.68s forwards; }
.commit.closing .commit-print { animation: labelMergeRight 0.68s forwards; }

.commit.open .check-btn { opacity: 0; pointer-events: none; }

/* Save-only booths (no printer): no split — the check reveals a full-width Save. The
   b-save rect is widened to the whole box by layoutGoo() (geometry is set in px). */
.commit.save-only .b-print,
.commit.save-only .commit-print { display: none; }
.commit.save-only.open .b-save { transform: translateX(0) scale(1); }

@media (prefers-reduced-motion: reduce) {
  .check-btn, .commit-pair, .b-center { transition-duration: 0.001s; }
  .commit.animating .b-save, .commit.animating .b-print,
  .commit.animating .commit-save, .commit.animating .commit-print,
  .commit.closing .b-center, .commit.closing .check-btn { animation: none; }
}

/* ---------------------------------------------------------------- sheet */

.sheet, .overlay {
  position: fixed;
  inset: 0;
  background: #0b0810cc;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 20;
  backdrop-filter: blur(6px);
}
.overlay { align-items: center; padding: 20px; }
.hidden { display: none !important; }

/* Collapsed print-status chip — shown when the guest taps Done while a print is
   still in the queue, so they can keep browsing and watch their place. */
/* A round, light badge floating in the upper-right, just below the app title. It
   reads as a bright bubble against the dark stage — icon on top, the place in line,
   then the ETA. */
.queue-widget {
  position: fixed;
  right: 16px;
  top: calc(env(safe-area-inset-top) + 78px);
  z-index: 60;
  width: 108px;
  height: 108px;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border-radius: 50%;
  border: 1px solid #ffffffcc;
  background: radial-gradient(120% 120% at 50% 22%, #ffffff, #eef1f8 72%, #dfe4f0);
  color: #241d2e;
  font: inherit;
  text-align: center;
  cursor: pointer;
  /* Gentle bob, shadow softening as it lifts, so it feels like it's hovering. */
  animation: qwFloat 3.4s ease-in-out infinite;
}
@keyframes qwFloat {
  0%, 100% { transform: translateY(0); box-shadow: 0 10px 22px #000a; }
  50% { transform: translateY(-8px); box-shadow: 0 18px 30px #0007; }
}
/* A playful colour halo that spins and breathes behind the badge — a moving glow that
   peeks out all around the white circle. Sits on its own layer behind the bubble. */
.queue-widget::before {
  content: '';
  position: absolute;
  inset: -16px;
  z-index: -1;
  border-radius: 50%;
  background: conic-gradient(from 0deg, #6a5cff, #a24bff, #ff4d97, #ff7a4d, #ffd23f, #4aa8c9, #6a5cff);
  filter: blur(9px);
  /* Keep the colour band OUTSIDE the bubble's edge so it reads as an outer glow, not a
     ring inside the white circle. The bubble radius sits at ~77% of this halo's radius,
     so the band starts past that and only its soft spill shows around the outside. */
  -webkit-mask: radial-gradient(closest-side, transparent 78%, #000 100%);
          mask: radial-gradient(closest-side, transparent 78%, #000 100%);
  animation: qwHalo 4.5s linear infinite;
  will-change: transform;
}
@keyframes qwHalo {
  0%   { transform: rotate(0turn) scale(1);    opacity: 0.8; }
  50%  { transform: rotate(0.5turn) scale(1.07); opacity: 1; }
  100% { transform: rotate(1turn) scale(1);    opacity: 0.8; }
}
.queue-widget:active { animation-play-state: paused; filter: brightness(0.95); }
.qw-icon { font-size: 26px; line-height: 1; margin-bottom: 3px; }
.qw-title {
  font-size: 16px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.2px;
  white-space: nowrap;
}
.qw-sub {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.1;
  color: #6b6076;
  white-space: nowrap;
}
@media (prefers-reduced-motion: reduce) {
  .queue-widget { animation: none; box-shadow: 0 10px 22px #000a; }
  .queue-widget::before { animation: none; opacity: 0.9; } /* keep the glow, drop the spin */
}

.sheet-card {
  width: 100%;
  max-width: 560px;
  background: var(--card);
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--line);
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height: 92dvh;
  overflow-y: auto;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { margin: 0; font-size: 16px; text-transform: uppercase; letter-spacing: 0.1em; }
.icon-btn { border: 0; background: #ffffff12; color: var(--ink); width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; }

.crop-wrap { display: flex; flex-direction: column; align-items: center; margin: 14px 0 6px; }
#cropCanvas {
  max-width: min(74vw, 320px);
  max-height: 44dvh;
  border-radius: 10px;
  background: #000;
  touch-action: none;
  cursor: grab;
}
.crop-hint { color: var(--ink-dim); font-size: 12px; margin: 10px 0 0; }

.slider { width: 100%; margin: 10px 0 14px; accent-color: var(--accent); height: 30px; }

.sheet-actions { display: flex; gap: 8px; margin-bottom: 8px; }
.sheet-actions .btn { flex: 1; padding: 13px 8px; font-size: 14px; }

/* ---------------------------------------------------------------- result */

.result-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 26px 20px;
  text-align: center;
  max-width: 420px;
  width: 100%;
}
/* The guest's print number — their ticket to match against the queue board/tray. */
.result-tag {
  display: inline-block;
  margin: 0 0 10px;
  padding: 4px 16px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 0.04em;
  color: #fff;
  background: var(--grad);
  background-size: 200% 200%;
  box-shadow: 0 6px 16px -6px #a24bffcc;
}
.result-emoji { font-size: 44px; }
.result-card h2 { margin: 10px 0 6px; font-size: 21px; }
.result-card p { margin: 0; color: var(--ink-dim); font-size: 15px; line-height: 1.5; }
.result-image { max-width: 150px; margin: 16px auto 0; display: block; border-radius: 6px; box-shadow: 0 10px 24px -12px #000; }
.send-anim { width: 190px; height: 240px; margin: 14px auto 0; display: block; }
.result-actions { display: flex; gap: 10px; margin-top: 22px; }
.result-actions .btn { flex: 1; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--bar-h) + env(safe-area-inset-bottom) + 16px);
  transform: translateX(-50%);
  background: #000000d9;
  color: #fff;
  padding: 12px 18px;
  border-radius: 999px;
  font-size: 14px;
  z-index: 40;
  max-width: 88vw;
  text-align: center;
}

@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise 0.18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1 id="boothName">BFF Photo Booth</h1>
      <span class="app-version" id="version"></span>
    </div>
  </header>

  <section class="stage" aria-label="Print preview">
    <div class="step-guide" id="stepGuide">
      <span class="step-kicker" id="stepKicker">Step 1 of 3</span>
      <span class="step-text" id="stepText">Pick your 4 best shots!</span>
      <span class="step-hint" id="stepHint">tap the button to add or snap them</span>
    </div>

    <!-- Step 2 only: a hand-drawn double-headed arrow with a gradient "fingertip"
         gliding left↔right, telling the guest they can swipe the layouts. Sits
         between the instruction and the coverflow. -->
    <div class="swipe-hint hidden" id="swipeHint" aria-hidden="true">
      <svg class="swipe-track" viewBox="0 0 150 40" aria-hidden="true" filter="url(#sketch)">
        <path d="M18 20 H132"/>
        <path d="M32 9 L15 20 L32 31"/>
        <path d="M118 9 L135 20 L118 31"/>
      </svg>
      <span class="swipe-finger"></span>
      <!-- Confetti bits that burst outward when the hint pops away on the first swipe. -->
      <i class="pop-bit" style="--a:0deg"></i>
      <i class="pop-bit" style="--a:60deg"></i>
      <i class="pop-bit" style="--a:120deg"></i>
      <i class="pop-bit" style="--a:180deg"></i>
      <i class="pop-bit" style="--a:240deg"></i>
      <i class="pop-bit" style="--a:300deg"></i>
    </div>

    <div class="paper-shadow" id="singleWrap">
      <canvas id="preview" aria-label="Live preview of your print"></canvas>
      <div class="pick-overlay" id="pickOverlay">
        <button class="btn btn-primary btn-pick" id="addAll" type="button">
          <span id="pickLabel">Take or Choose 4 Photos</span>
        </button>
        <svg class="doodle doodle-pick" viewBox="0 0 96 86" aria-hidden="true" filter="url(#sketch)">
          <path class="dl-line" d="M20 8 C 62 12, 74 36, 54 62"/>
          <path class="dl-head" d="M38 50 L 55 66 L 74 54"/>
        </svg>
      </div>
    </div>

    <div class="coverflow hidden" id="coverflow" aria-label="Choose a design, swipe left or right">
      <div class="cf-track" id="cfTrack"></div>

     fuse into liquid blobs and pull apart with a stretching neck. -->

    </filter>

         linear-gradient(115deg, #6a5cff 0%, #a24bff 32%, #ff4d97 64%, #ff7a4d 100%).

         as in CSS), with endpoints set per-shape by layoutGoo() so 115° is true on the
         wide pills AND the square check circle. Static, exactly like the CSS. -->
    <!-- Endpoints (the 115° angle, zoomed 2.2×) and the drifting gradientTransform are

         in Safari, so a requestAnimationFrame loop pans it instead — reliably, in every
         browser. -->
    <linearGradient id="gradSave">
      <stop offset="0"    stop-color="#6a5cff"/><stop offset="0.32" stop-color="#a24bff"/>
      <stop offset="0.64" stop-color="#ff4d97"/><stop offset="1"    stop-color="#ff7a4d"/>
    </linearGradient>
    <linearGradient id="gradPrint">
      <stop offset="0"    stop-color="#6a5cff"/><stop offset="0.32" stop-color="#a24bff"/>
      <stop offset="0.64" stop-color="#ff4d97"/><stop offset="1"    stop-color="#ff7a4d"/>

      <stop offset="0.64" stop-color="#ff4d97"/><stop offset="1"    stop-color="#ff7a4d"/>
    </linearGradient>
    <!-- At rest: the CSS drop-shadow(0 8px 16px #0006). CSS blur radius = 2×stdDev. -->
    <filter id="gooRest" x="-60%" y="-150%" width="220%" height="400%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>

      <feComposite in="SourceGraphic" in2="goo" operator="atop" result="merged"/>

    </filter>

<script type="module">

const __PREVIEW_SESSION = {
  version: "1.73.38", boothName: "BFF Photo Booth",
  message: 'Pick 4 photos. Take it home.',
  maxCopies: 3, defaultCopies: 1, shareHashtag: '#bff2026',
  printingEnabled: true, previewNoPrint: true, requireApproval: false, keyRequired: false,
  remote: false, dryRun: false, sticker: 'backgrounds/sticker.png',
};
const __origFetch = window.fetch.bind(window);
window.fetch = (input, init) => {
  const u = typeof input === 'string' ? input : (input && input.url) || '';
  if (u.includes('/api/session')) return Promise.resolve(new Response(JSON.stringify(__PREVIEW_SESSION), { status: 200, headers: { 'content-type': 'application/json' } }));
  if (u.includes('/api/printers')) return Promise.resolve(new Response(JSON.stringify({ printers: [{ name: 'Preview Printer' }], remote: false, agentOnline: true }), { status: 200, headers: { 'content-type': 'application/json' } }));
  if (u.includes('/api/')) return Promise.resolve(new Response(JSON.stringify({ ok: false, error: 'Preview mode — printing needs the booth.' }), { status: 503, headers: { 'content-type': 'application/json' } }));
  return __origFetch(input, init);
};


/* ===== js/filters.mjs ===== */
// Photo looks. ctx.filter is used where the browser supports it (fast, GPU
// backed); older iOS Safari falls back to the equivalent per-pixel maths so a
// guest on an old phone still gets the same print.

const FILTERS = {
  none: { id: 'none', name: 'True', css: 'none' },
  bw: { id: 'bw', name: 'B&W', css: 'grayscale(1) contrast(1.08)' },
  noir: { id: 'noir', name: 'Noir', css: 'grayscale(1) contrast(1.35) brightness(0.96)' },
  warm: { id: 'warm', name: 'Warm', css: 'saturate(1.12) sepia(0.18) brightness(1.03)' },
  cool: { id: 'cool', name: 'Cool', css: 'saturate(1.05) hue-rotate(-8deg) brightness(1.02)' },
  fade: { id: 'fade', name: 'Faded', css: 'contrast(0.88) saturate(0.85) brightness(1.08)' },
};

const FILTER_ORDER = ['none', 'bw', 'noir', 'warm', 'cool', 'fade'];

let ctxFilterSupported = null;

function supportsCtxFilter() {
  if (ctxFilterSupported !== null) return ctxFilterSupported;
  try {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.filter = 'grayscale(1)';
    ctxFilterSupported = ctx.filter === 'grayscale(1)';
  } catch {
    ctxFilterSupported = false;
  }
  return ctxFilterSupported;
}

const clamp = (v) => (v < 0 ? 0 : v > 255 ? 255 : v);

const PIXEL_OPS = {
  none: null,
  bw: (r, g, b) => {
    const y = 0.299 * r + 0.587 * g + 0.114 * b;
    const c = (y - 128) * 1.08 + 128;
    return [c, c, c];
  },
  noir: (r, g, b) => {
    const y = 0.299 * r + 0.587 * g + 0.114 * b;
    const c = ((y - 128) * 1.35 + 128) * 0.96;
    return [c, c, c];
  },
  warm: (r, g, b) => [r * 1.07 + 8, g * 1.02 + 2, b * 0.93],
  cool: (r, g, b) => [r * 0.93, g * 1.0, b * 1.09 + 6],
  fade: (r, g, b) => {
    const y = 0.299 * r + 0.587 * g + 0.114 * b;
    const mix = (v) => (v * 0.85 + y * 0.15) * 0.88 + 30;
    return [mix(r), mix(g), mix(b)];
  },
};

/** Apply a filter preset to a whole canvas in place (fallback path). */
function applyPixelFilter(canvas, filterId) {
  const op = PIXEL_OPS[filterId];
  if (!op) return;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = image.data;
  for (let i = 0; i < d.length; i += 4) {
    const [r, g, b] = op(d[i], d[i + 1], d[i + 2]);
    d[i] = clamp(r);
    d[i + 1] = clamp(g);
    d[i + 2] = clamp(b);
  }
  ctx.putImageData(image, 0, 0);
}


/* ===== js/layouts.mjs ===== */
// Print layouts. Every page is described in real pixels at 300 DPI, so the
// canvas we compose on the phone is literally the file that goes to the tray.

const DPI = 300;
const inches = (n) => Math.round(n * DPI);

function stripLayout() {
  // Two identical 2x6 strips on one 4x6 sheet — cut down the middle.
  const page = { w: inches(4), h: inches(6) };
  const stripW = page.w / 2;
  const pad = 44;
  const gap = 22;
  const footer = 150;
  const cellW = stripW - pad * 2;
  const cellH = Math.floor((page.h - pad * 2 - footer - gap * 3) / 4);
  const cells = [];
  for (let copy = 0; copy < 2; copy++) {
    for (let i = 0; i < 4; i++) {
      cells.push({
        x: copy * stripW + pad,
        y: pad + i * (cellH + gap),
        w: cellW,
        h: cellH,
        photo: i,
      });
    }
  }
  const captionY = pad + 4 * cellH + 3 * gap;
  return {
    id: 'strip',
    name: 'Classic strip',
    blurb: 'Two 2×6 strips on one 4×6: keep one, give one away',
    paper: '4×6 portrait',
    media: 'Custom.4x6in',
    page,
    cells,
    captions: [
      { x: pad, y: captionY, w: cellW, h: page.h - pad - captionY },
      { x: stripW + pad, y: captionY, w: cellW, h: page.h - pad - captionY },
    ],
    cutLine: { x: stripW, y1: 0, y2: page.h },
  };
}

function gridLayout() {
  // Cells are computed per print from the real photos (see resolveGrid), so a
  // mix of portrait and landscape shots each fit without cropping. The static
  // values here are just the defaults; resolveGrid fills the sheet edge to edge.
  const page = { w: inches(4), h: inches(6) };
  return {
    id: 'grid',
    name: 'Auto grid',
    blurb: 'One big hero photo with three beside it, nothing cropped',
    paper: '4×6 portrait',
    media: 'Custom.4x6in',
    page,
    dynamic: true,
    cells: [], // filled in by resolveGrid at render time
    captions: [],
    cutLine: null,
  };
}

/** Aspect ratio (w/h) a photo occupies, honouring a 90° rotation. */
function photoAspect(photo) {
  if (!photo || !photo.bitmap) return 3 / 4; // an empty slot stands in as portrait
  const t = photo.transform || {};
  const swap = Math.abs((t.rot || 0) % 180) === 90;
  const w = swap ? photo.bitmap.height : photo.bitmap.width;
  const h = swap ? photo.bitmap.width : photo.bitmap.height;
  return w / h || 3 / 4;
}

const PORTRAIT_4X6 = { w: inches(4), h: inches(6), media: 'Custom.4x6in', paper: '4×6 portrait' };
const LANDSCAPE_6X4 = { w: inches(6), h: inches(4), media: 'Custom.6x4in', paper: '6×4 landscape' };

const GAP = 14; // uniform gutter between photos, in print pixels — kept tight to fill the paper

// The sticker asset's own aspect ratio (w/h) — the small corner badge is shaped to
// this so the art fills it exactly.
const STICKER_AR = 1448 / 1086;

// The picker grid is computed by OPTIMIZATION, not a fixed template (see CLAUDE.md).
// Nothing is cropped: every cell has its photo's exact aspect ratio, so the whole photo
// shows. We search sheet orientation × arrangements and keep the one with the greatest
// coverage, subject to the rules: one hero, hero ≤ 2× the smallest photo, and the sticker
// a real 5th cell that is never the hero. Whole photos can't tile a rectangle, so the
// leftover is the decorative paper (matting) — that slack is the cost of "no crop", and
// holding the hero to 2× keeps every photo near-equal, which also can't tile perfectly.

const SHEETS = [PORTRAIT_4X6, LANDSCAPE_6X4];

/** Every ordered partition of a list into non-empty groups. */
function partitions(arr) {
  if (arr.length === 0) return [[]];
  const [first, ...rest] = arr;
  const out = [];
  for (const p of partitions(rest)) {
    for (let i = 0; i < p.length; i++) out.push(p.map((g, j) => (j === i ? [first, ...g] : g)));
    out.push([[first], ...p]);
  }
  return out;
}


// Target AREA ratios for a hero design (rule 3 + 4 + 5): the hero is exactly 2× every
// other photo — one unmistakable hero, and no photo more than 2× another — while the
// sticker is a small badge, clearly the smallest thing on the page (never the hero).
const HERO_RATIO = 2;
const PHOTO_RATIO = 1;
const STICKER_RATIO = 0.55;

/** Pack fixed-size items (each shaped to its aspect, sized by √ratio so areas match the
 *  ratios above) into stacked rows, top-to-bottom, each row centred. `asCols` transposes
 *  the whole thing into side-by-side columns. Returns the cells and the bounding box —
 *  the caller scales that box to the sheet, so we keep the exact area ratios (no crop,
 *  and the hero stays exactly 2× every photo). */
function packFixed(groups, items, asCols) {
  const K = 1000;
  // Build each line (a row, or a column when asCols). Along-axis = width for rows.
  const lines = groups.map((g) => {
    const cells = g.map((i) => {
      const side = Math.sqrt(items[i].ratio) * K;      // area = ratio·K²
      const w = side * Math.sqrt(items[i].aspect);
      const h = side / Math.sqrt(items[i].aspect);
      return { item: i, w, h };
    });
    const thick = asCols ? Math.max(...cells.map((c) => c.w)) : Math.max(...cells.map((c) => c.h));
    const along = cells.reduce((s, c) => s + (asCols ? c.h : c.w), 0) + GAP * (cells.length - 1);
    return { cells, thick, along };
  });
  const bboxAlong = Math.max(...lines.map((l) => l.along));
  const bboxThick = lines.reduce((s, l) => s + l.thick, 0) + GAP * (lines.length - 1);
  const out = [];
  let off = 0; // across-axis offset (y for rows, x for cols)
  for (const l of lines) {
    let pos = (bboxAlong - l.along) / 2; // centre the line
    for (const c of l.cells) {
      if (asCols) out.push({ item: c.item, x: off + (l.thick - c.w) / 2, y: pos, w: c.w, h: c.h });
      else out.push({ item: c.item, x: pos, y: off + (l.thick - c.h) / 2, w: c.w, h: c.h });
      pos += (asCols ? c.h : c.w) + GAP;
    }
    off += l.thick + GAP;
  }
  return { cells: out, bboxW: asCols ? bboxThick : bboxAlong, bboxH: asCols ? bboxAlong : bboxThick };
}

/** The sticker's placement spec for a frame: its aspect ratio, or null for none. */
function stickerSpec(frame) {
  return frame && frame.sticker ? { aspect: frame.stickerAR || STICKER_AR } : null;
}

/** Build one hero design's cells. The five items carry fixed area ratios (hero 2×, each
 *  photo 1×, sticker 0.55×); we search both sheets and every row/column arrangement and
 *  keep the one whose block scales up the most — i.e. fills the most paper. Because the
 *  ratios are fixed, the hero is always exactly 2× every photo and the sticker is always
 *  the smallest cell, whatever the packing chooses. */
function heroDesign(aspects, heroIndex, stickerAR) {
  const items = aspects.map((a, i) => ({ aspect: a, photo: i, ratio: i === heroIndex ? HERO_RATIO : PHOTO_RATIO }));
  if (stickerAR) items.push({ aspect: stickerAR, sticker: true, ratio: STICKER_RATIO });
  const idx = items.map((_, i) => i);
  let best = null;
  for (const page of SHEETS) {
    for (const part of partitions(idx)) {
      for (const asCols of [false, true]) {
        const pk = packFixed(part, items, asCols);
        const sc = Math.min(page.w / pk.bboxW, page.h / pk.bboxH);
        const cov = pk.cells.reduce((s, c) => s + c.w * c.h, 0) * sc * sc / (page.w * page.h);
        if (!best || cov > best.cov) best = { cov, pk, sc, page };
      }
    }
  }
  const { pk, sc, page } = best;
  const x0 = (page.w - pk.bboxW * sc) / 2, y0 = (page.h - pk.bboxH * sc) / 2;
  const cells = pk.cells.map((c) => {
    const cell = { x: x0 + c.x * sc, y: y0 + c.y * sc, w: c.w * sc, h: c.h * sc, fit: 'contain' };
    return items[c.item].sticker ? { ...cell, extra: 'sticker' } : { ...cell, photo: items[c.item].photo };
  });
  cells.sort((a, b) => (a.photo === heroIndex ? -1 : b.photo === heroIndex ? 1 : 0)); // hero leads
  return { cells, page };
}

/** The no-hero design: four equal photos (all ratio 1) plus the small sticker, packed for
 *  the most paper — same machinery as a hero design but with no cell enlarged. */
function evenDesign(aspects, stickerAR) {
  const items = aspects.map((a, i) => ({ aspect: a, photo: i, ratio: PHOTO_RATIO }));
  if (stickerAR) items.push({ aspect: stickerAR, sticker: true, ratio: STICKER_RATIO });
  const idx = items.map((_, i) => i);
  let best = null;
  for (const page of SHEETS) {
    for (const part of partitions(idx)) {
      for (const asCols of [false, true]) {
        const pk = packFixed(part, items, asCols);
        const sc = Math.min(page.w / pk.bboxW, page.h / pk.bboxH);
        const cov = pk.cells.reduce((s, c) => s + c.w * c.h, 0) * sc * sc / (page.w * page.h);
        if (!best || cov > best.cov) best = { cov, pk, sc, page };
      }
    }
  }
  const { pk, sc, page } = best;
  const x0 = (page.w - pk.bboxW * sc) / 2, y0 = (page.h - pk.bboxH * sc) / 2;
  const cells = pk.cells.map((c) => {
    const cell = { x: x0 + c.x * sc, y: y0 + c.y * sc, w: c.w * sc, h: c.h * sc, fit: 'contain' };
    return items[c.item].sticker ? { ...cell, extra: 'sticker' } : { ...cell, photo: items[c.item].photo };
  });
  return { cells, page };
}

const media = (page) => (page.w > page.h ? 'Custom.6x4in' : 'Custom.4x6in');
const paper = (page) => (page.w > page.h ? '6×4 landscape' : '4×6 portrait');

/**
 * The booth's own pick: photo 0 as the hero, on whichever sheet fills the most paper.
 */
function resolveGrid(base, photos, heroIndex = 0, sticker = null) {
  const d = heroDesign(photos.map(photoAspect), heroIndex, sticker && sticker.aspect);
  return { cells: d.cells, captions: [], page: d.page, media: media(d.page), paper: paper(d.page) };
}

/**
 * The designs offered as cards in the picker: each photo as the hero (featured, ≤ 2× the
 * smallest), plus an even layout with no hero. Every design is optimised for coverage, keeps
 * whole photos (no crop), and carries the sticker as a real 5th cell that is never the hero.
 */
function designVariants(base, photos, sticker = null) {
  const aspects = photos.map(photoAspect);
  const ar = sticker && sticker.aspect;
  const out = photos.map((_, hero) => {
    const d = heroDesign(aspects, hero, ar);
    return {
      key: `hero:${hero}`, kind: 'hero', heroIndex: hero, arrange: 'top',
      title: `Big #${hero + 1}`, sub: 'featured', captions: [],
      cells: d.cells, page: d.page, media: media(d.page), paper: paper(d.page),
    };
  });
  const e = evenDesign(aspects, ar);
  out.push({
    key: 'even', kind: 'even', title: 'Four equal', sub: 'no big one', captions: [],
    cells: e.cells, page: e.page, media: media(e.page), paper: paper(e.page),
  });
  return out;
}

function filmstripLayout() {
  // Four tall frames across a 6x4 landscape sheet.
  const page = { w: inches(6), h: inches(4) };
  const pad = 56;
  const gap = 24;
  const footer = 132;
  const cellW = Math.floor((page.w - pad * 2 - gap * 3) / 4);
  const cellH = page.h - pad * 2 - footer;
  const cells = [];
  for (let i = 0; i < 4; i++) {
    cells.push({ x: pad + i * (cellW + gap), y: pad, w: cellW, h: cellH, photo: i });
  }
  const captionY = pad + cellH;
  return {
    id: 'filmstrip',
    name: 'Wide filmstrip',
    blurb: 'Four tall frames on a 6×4 landscape print',
    paper: '6×4 landscape',
    media: 'Custom.6x4in',
    page,
    cells,
    captions: [{ x: pad, y: captionY, w: page.w - pad * 2, h: page.h - pad - captionY }],
    cutLine: null,
  };
}

const LAYOUTS = {

  grid: gridLayout(),
  filmstrip: filmstripLayout(),

const LAYOUT_ORDER = ['strip', 'grid', 'filmstrip'];

const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';

// --- watercolor background art -------------------------------------------------
// Decorative full-bleed background images (the guest's uploaded PNGs). They load
// async; composePage draws whichever is ready and falls back to the paper colour
// until then. app.mjs calls preloadArt() at boot and re-renders on ready.
const artCache = new Map(); // src -> HTMLImageElement | 'pending' | 'error'
function preloadArt(srcs, onReady) {
  for (const src of srcs) {
    if (artCache.has(src)) continue;
    artCache.set(src, 'pending');
    const img = new Image();
    img.onload = () => { artCache.set(src, img); if (onReady) onReady(); };
    img.onerror = () => { artCache.set(src, 'error'); };
    img.src = src;
  }
}

  const v = artCache.get(src);
  return v && v !== 'pending' && v !== 'error' ? v : null;
}
/** Pick a background for this page from the frame's list — by orientation, varied
 *  per design so neighbouring cards in the picker don't all look identical. */
function artSrcFor(frame, layout) {
  const list = layout.page.w >= layout.page.h ? frame.art.land : frame.art.portrait;
  let hash = 0;
  const key = String(layout.key || layout.id || '');
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
  return list[hash % list.length];
}

  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);

/**
 * The smallest scale at which the photo, rotated by `rot`, still fully covers
 * the cell — so a rotated crop never leaves a blank corner. A rotated rectangle
 * of source size (W×H)·scale covers a cell (cellW×cellH) when, along each of the
 * photo's own axes, its half-extent clears the cell's rotated footprint:
 *   W·scale/2 ≥ (cellW·|cos| + cellH·|sin|)/2, and the same for H with axes swapped.
 * For an unrotated `contain` cell (the layout shapes each cell to its photo) that
 * reduces to the exact fit, so nothing crops until the guest zooms or rotates.
 */
function coverBase(cellW, cellH, W, H, rot, fit) {
  if (fit === 'contain' && rot % 360 === 0) return Math.min(cellW / W, cellH / H);
  const rad = (rot * Math.PI) / 180;
  const c = Math.abs(Math.cos(rad));
  const s = Math.abs(Math.sin(rad));
  return Math.max((cellW * c + cellH * s) / W, (cellW * s + cellH * c) / H);

/**
 * Keep a crop inside its cell: however the guest zooms, pans, or rotates, the
 * photo still covers the frame, so a print can never come out with a sliver of
 * blank paper. Pan is clamped in the photo's own (rotated) frame, then mapped
 * back to page axes, so the reachable range is correct at any angle.
 */
function clampTransform(transform, cellW, cellH, bitmap, fit = 'cover') {
  const t = { zoom: 1, dx: 0, dy: 0, rot: 0, ...transform };
  t.zoom = Math.min(4, Math.max(1, t.zoom));
  const rad = (t.rot * Math.PI) / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  const scale = coverBase(cellW, cellH, bitmap.width, bitmap.height, t.rot, fit) * t.zoom;

  // Half the cell's footprint measured along the photo's own axes.
  const needX = (cellW * Math.abs(cos) + cellH * Math.abs(sin)) / 2;
  const needY = (cellW * Math.abs(sin) + cellH * Math.abs(cos)) / 2;
  const slackX = Math.max(0, (bitmap.width * scale) / 2 - needX);
  const slackY = Math.max(0, (bitmap.height * scale) / 2 - needY);

  // Pan is stored as page-frame fractions of the cell. Rotate it into the photo
  // frame to clamp against the slack, then rotate it back.
  const px = t.dx * cellW;
  const py = t.dy * cellH;
  let lx = px * cos + py * sin;
  let ly = -px * sin + py * cos;
  lx = Math.min(slackX, Math.max(-slackX, lx));
  ly = Math.min(slackY, Math.max(-slackY, ly));
  t.dx = cellW ? (lx * cos - ly * sin) / cellW : 0;
  t.dy = cellH ? (lx * sin + ly * cos) / cellH : 0;
  return t;
}

/** Draw one photo, cover-fitted into a cell and honouring the guest's crop. */
function drawPhoto(ctx, cell, photo, filterId) {
  const { bitmap } = photo;
  const fit = cell.fit || 'cover';
  const t = clampTransform(photo.transform, cell.w, cell.h, bitmap, fit);
  const nw = bitmap.width;
  const nh = bitmap.height;
  const scale = coverBase(cell.w, cell.h, nw, nh, t.rot, fit) * t.zoom;

  ctx.save();
  if (cell.radius) roundRectPath(ctx, cell.x, cell.y, cell.w, cell.h, cell.radius);
  else { ctx.beginPath(); ctx.rect(cell.x, cell.y, cell.w, cell.h); }

  const useCtxFilter = filterId !== 'none' && supportsCtxFilter();

  ctx.translate(cell.x + cell.w / 2 + t.dx * cell.w, cell.y + cell.h / 2 + t.dy * cell.h);
  ctx.rotate((t.rot * Math.PI) / 180);
  ctx.drawImage(bitmap, (-nw * scale) / 2, (-nh * scale) / 2, nw * scale, nh * scale);
  ctx.restore();

  if (filterId !== 'none' && !useCtxFilter) {

    const tile = document.createElement('canvas');

    tctx.translate(tile.width / 2 + t.dx * cell.w, tile.height / 2 + t.dy * cell.h);
    tctx.rotate((t.rot * Math.PI) / 180);

function drawPlaceholder(ctx, cell, index, frame) {

  ctx.setLineDash([]);
  ctx.globalAlpha = 0.55;

  ctx.restore();

/**

 * measuring, or a tracked-out footer runs off the edge of the paper.

function fitText(ctx, text, maxWidth, startSize, weight, spacingRatio = 0) {

    ctx.font = `${weight} ${size}px ${FONT}`;

  };
  apply();
  while (size > 10 && ctx.measureText(text).width > maxWidth) {
    size -= 2;
    apply();
  }

function drawCaption(ctx, box, frame, caption, subtitle) {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.letterSpacing = '0px';
  const cx = box.x + box.w / 2;
  const hasCaption = Boolean(caption);
  const captionSize = Math.round(box.h * (hasCaption ? 0.42 : 0));
  const subSize = Math.round(box.h * (hasCaption ? 0.2 : 0.28));

  ctx.textBaseline = 'alphabetic';

  if (hasCaption) {
    ctx.fillStyle = frame.ink;
    fitText(ctx, caption, box.w, captionSize, '700');
    ctx.fillText(caption, cx, box.y + box.h * 0.52);

  if (subtitle) {
    ctx.fillStyle = frame.accent;
    fitText(ctx, subtitle, box.w, subSize, '500', 0.12);
    ctx.fillText(subtitle, cx, box.y + box.h * (hasCaption ? 0.88 : 0.62));

function drawCutLine(ctx, layout, frame) {

  ctx.save();
  ctx.strokeStyle = frame.accent;
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = 2;

 * Compose the whole page.

/** The layout to print for this state — resolving a dynamic grid to real cells,

  const icc = srgbIccBytes();
  const segLen = 2 + 12 + 2 + icc.length; // length field + tag + seq/count + profile
  const seg = new Uint8Array(2 + segLen);
  seg[0] = 0xff; seg[1] = 0xe2;
  seg[2] = (segLen >> 8) & 0xff; seg[3] = segLen & 0xff;
  const tag = 'ICC_PROFILE\0';
  for (let k = 0; k < 12; k++) seg[4 + k] = tag.charCodeAt(k);
  seg[16] = 1; seg[17] = 1; // chunk 1 of 1
  seg.set(icc, 18);
  const out = new Uint8Array(b.length + seg.length);
  out.set(b.subarray(0, 2), 0);        // SOI
  out.set(seg, 2);                     // our APP2 right after it
  out.set(b.subarray(2), 2 + seg.length);
  return out;
}

/** Declare a PNG as sRGB with an sRGB chunk after IHDR (unless already colour-tagged). */
function tagPngBytes(b) {
  const sig = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
  for (let k = 0; k < 8; k++) if (b[k] !== sig[k]) return b;
  let pos = 8, ihdrEnd = -1, tagged = false;
  while (pos + 12 <= b.length) {
    const len = b[pos] * 0x1000000 + (b[pos + 1] << 16) + (b[pos + 2] << 8) + b[pos + 3];
    const type = String.fromCharCode(b[pos + 4], b[pos + 5], b[pos + 6], b[pos + 7]);
    if (type === 'IHDR') ihdrEnd = pos + 12 + len;
    if (type === 'iCCP' || type === 'sRGB') tagged = true;
    if (type === 'IDAT' || type === 'IEND') break;
    pos += 12 + len;
  }
  if (tagged || ihdrEnd < 0) return b;
  const chunk = new Uint8Array(13);
  chunk[3] = 1; // data length 1
  chunk[4] = 0x73; chunk[5] = 0x52; chunk[6] = 0x47; chunk[7] = 0x42; // 'sRGB'
  chunk[8] = 0; // rendering intent: perceptual
  const crc = crc32(chunk.subarray(4, 9));
  chunk[9] = (crc >>> 24) & 0xff; chunk[10] = (crc >>> 16) & 0xff; chunk[11] = (crc >>> 8) & 0xff; chunk[12] = crc & 0xff;
  const out = new Uint8Array(b.length + 13);
  out.set(b.subarray(0, ihdrEnd), 0);
  out.set(chunk, ihdrEnd);
  out.set(b.subarray(ihdrEnd), ihdrEnd + 13);
  return out;
}

/** Return a copy of the blob tagged as sRGB, so the printer colour-manages the app's
 *  output like a real photo. Best effort: any hiccup returns the original blob. */
async function tagSrgb(blob) {
  try {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const out = blob.type === 'image/jpeg' ? tagJpegBytes(bytes)
      : blob.type === 'image/png' ? tagPngBytes(bytes)
        : bytes;
    return out === bytes ? blob : new Blob([out], { type: blob.type });
  } catch {
    return blob;
  }
}

async function exportPrint(state, { rotateForPaper = false, scale = PRINT_SCALE, safeInset = 0 } = {}) {
  const page = document.createElement('canvas');
  composePage(page, state, scale, null, safeInset);

  let canvas = page;
  let rotated = false; // true when a landscape design was turned 90° for portrait paper
  if (rotateForPaper && page.width > page.height) {
    canvas = document.createElement('canvas');
    canvas.width = page.height;
    canvas.height = page.width;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(Math.PI / 2); // 90° clockwise: long edge now runs down the 6" side
    ctx.drawImage(page, -page.width / 2, -page.height / 2);
    rotated = true;
  }

  // A photographic page (the watercolor paper + photos) makes a huge PNG that is
  // slow to encode — ~6.6MB and ~400ms at 600 DPI, which hitched the coverflow — and
  // it always fell back to JPEG anyway. So for art frames, encode JPEG straight away
  // (~75ms, indistinguishable on photo paper). Plain frames keep lossless PNG.
  const photographic = !!(FRAMES[state.frameId] && FRAMES[state.frameId].art);
  let blob;
  if (photographic) {
    blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.95));
  } else {
    blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
    if (blob && blob.size > 3 * 1024 * 1024) {
      const jpeg = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.95));
      if (jpeg) blob = jpeg;
    }
  }
  if (!blob) throw new Error('This browser could not render the print.');
  blob = await tagSrgb(blob); // ship an sRGB profile so the printer colour-manages it like a photo
  return { blob, width: canvas.width, height: canvas.height, rotated };
}

/** Single photo filling a canvas — used by the crop editor and the slot thumbs. */
function drawSinglePhoto(canvas, photo, filterId = 'none') {
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawPhoto(ctx, { x: 0, y: 0, w: canvas.width, h: canvas.height }, photo, filterId);
  return canvas;
}


/* ===== js/app.mjs ===== */

const $ = (id) => document.getElementById(id);
const MAX_SOURCE_DIM = 3600; // fills a full-page cell at the 600 DPI print scale, still gentle on memory

/** Each print gets a running number from the server (P1, P2, …) — the guest's ticket. */
const printTag = (job) => (job && job.printNo) ? `P${job.printNo}` : '';
function setResultTag(job) {
  const el = $('resultTag');
  if (!el) return;
  const t = printTag(job);
  el.textContent = t;
  el.classList.toggle('hidden', !t);
}

// One layout, one look, one paper. The guest picks photos and prints — that is
// the whole app.
const state = {
  layoutId: 'grid',
  frameId: 'watercolor',
  filterId: 'none',
  caption: '',
  subtitle: '',
  copies: 1,
  designKey: null, // which coverflow design is chosen; null = the booth's auto-best
  photos: [null, null, null, null],
};

const session = {
  boothName: 'Photo Booth',
  maxCopies: 3,
  printingEnabled: true,
  requireApproval: false,
  keyRequired: false,
  remote: false,
  dryRun: false,
  online: false,
  previewNoPrint: false, // true only in the hosted preview: Print shows but is a no-op
};

const KEY_STORAGE = 'booth.key';

/**
 * A public booth carries its access key in the QR link (?k=…). Stash it and
 * tidy the address bar, so the guest never types anything and a shared
 * screenshot of the URL bar does not hand out printing rights.
 */
function claimAccessKey() {
  const url = new URL(location.href);
  const fromLink = url.searchParams.get('k');
  if (fromLink) {
    try {
      localStorage.setItem(KEY_STORAGE, fromLink);
    } catch {
      /* private mode — the key still works for this page load */
    }
    url.searchParams.delete('k');
    history.replaceState(null, '', url.pathname + url.search + url.hash);
    return fromLink;
  }
  try {
    return localStorage.getItem(KEY_STORAGE) || '';
  } catch {
    return '';
  }
}

let accessKey = claimAccessKey();

let editorIndex = null;
let pendingSlot = null;
let replaceAllNext = false;
let lastPrintBlob = null;
let printGeneration = 0; // bumped whenever the page changes, so stale renders are dropped
let warmTimer = null;
let gooTimer = null;  // keeps the heavy goo filter on only during the check split
let queuePoll = null; // re-fetches queue standing from the booth
let queueTick = null; // ticks the countdown down between fetches
let currentJob = null; // the print the result modal / queue pill is showing
let queueMinimized = false; // the modal is collapsed to the small queue pill

// ---------------------------------------------------------------- utilities

function toast(message, ms = 2600) {
  const el = $('toast');
  el.textContent = message;
  el.classList.remove('hidden');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => el.classList.add('hidden'), ms);
}

function todayStamp() {
  return new Date()
    .toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' })
    .toUpperCase();
}

/** Facebook / Messenger's Android in-app browser (a WebView) shows an "allow media" error for
 *  an image-only file input: `accept="image/*"` makes the WebView launch the gallery intent,
 *  which needs a media runtime permission the Facebook app often does not hold. The plain
 *  document picker (Storage Access Framework) needs no such permission. So on that WebView we
 *  drop the image filter and let loadPhoto reject anything that is not an image. */
function isFbAndroidWebView() {
  const ua = navigator.userAgent || '';
  return /Android/i.test(ua) && /\b(FBAN|FBAV|FB_IAB)\b/.test(ua);
}

/** Set the picker's `accept` for the current browser: image-only everywhere except the FB
 *  Android WebView, where an image filter triggers the "allow media" block. */
function primePicker(input) {
  if (isFbAndroidWebView()) input.removeAttribute('accept');
  else input.setAttribute('accept', 'image/*');
}

/** iPhone/Samsung gallery photos are frequently HEIC/HEIF, which Android Chrome can't
 *  decode (the camera hands us a plain JPEG, which is why "Take photo" always works). */
function looksHeic(file) {
  return /hei[cf]/i.test(file.type || '') || /\.hei[cf]$/i.test(file.name || '');
}

/** Load the HEIC→JPEG converter on demand (only when a HEIC is actually picked), so the
 *  base app stays light. Resolves to window.heic2any, or null if it can't be fetched. */
let heicLoader = null;
function ensureHeic() {
  if (window.heic2any) return Promise.resolve(window.heic2any);
  if (heicLoader) return heicLoader;
  heicLoader = new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
    s.onload = () => resolve(window.heic2any || null);
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
  return heicLoader;
}

async function convertHeic(file) {
  const heic2any = await ensureHeic();
  if (!heic2any) return null;
  const out = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 });
  return Array.isArray(out) ? out[0] : out; // a multi-image HEIC yields an array
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

function imgFrom(url, revoke) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = async () => {
      try { if (img.decode) await img.decode(); } catch { /* onload already fired; use it */ }
      if (revoke) URL.revokeObjectURL(url);
      resolve(img.naturalWidth ? img : null);
    };
    img.onerror = () => { if (revoke) URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

/** Try every decode path a real phone might need, newest/cheapest first. */
async function decodeAny(file) {
  try { const b = await createImageBitmap(file, { imageOrientation: 'from-image' }); if (b && b.width) return b; } catch { /* try next */ }
  try { const b = await createImageBitmap(file); if (b && b.width) return b; } catch { /* try next */ }
  try { const img = await imgFrom(URL.createObjectURL(file), true); if (img) return img; } catch { /* try next */ }
  try { const img = await imgFrom(await fileToDataUrl(file), false); if (img) return img; } catch { /* give up */ }
  return null;
}

/** Decode a picked file, honouring EXIF rotation, and shrink it for memory. Handles
 *  HEIC/HEIF from the gallery by converting to JPEG first when needed. */
async function loadPhoto(file) {
  let source;
  if (looksHeic(file)) {
    // Convert first; if that can't run, still try a direct decode in case it's mislabelled.
    source = (await tryHeicDecode(file)) || (await decodeAny(file));
  } else {
    // Decode directly; if every path fails it may be a HEIC with an image/* or empty type.
    source = (await decodeAny(file)) || (await tryHeicDecode(file));
  }
  if (!source || !source.width) {
    throw new Error(looksHeic(file)
      ? 'That looks like a HEIC photo this phone can’t open here. Tap “Take photo”, or pick a JPEG.'
      : 'Could not open that photo. Try another one, or tap “Take photo”.');
  }
  return downscale(source, MAX_SOURCE_DIM);
}

async function tryHeicDecode(file) {
  try {
    const jpeg = await convertHeic(file);
    if (jpeg) return await decodeAny(jpeg);
  } catch { /* converter unavailable or failed */ }
  return null;
}

function downscale(source, maxDim) {
  const w = source.width || source.naturalWidth;
  const h = source.height || source.naturalHeight;
  const longest = Math.max(w, h);
  if (longest <= maxDim) return source;
  const ratio = maxDim / longest;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w * ratio);
  canvas.height = Math.round(h * ratio);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
