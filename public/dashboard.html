<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Hawak Mo ang Booth (temporary name)</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/saas.css">
<script>try{var t=localStorage.getItem('bff-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <div class="brand"><span class="dot"></span> Hawak Mo ang Booth <span class="brand-temp"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.5-3.5a6 6 0 0 1-7.9 7.9l-6.5 6.5a2.1 2.1 0 0 1-3-3l6.5-6.5a6 6 0 0 1 7.9-7.9z"/></svg> Temporary name</span></div>
    <div style="display:flex; gap:10px; align-items:center;">
      <span id="who" class="meta"></span>
      <button class="theme-toggle" data-theme-toggle type="button"></button>
      <button class="btn ghost" id="logout" type="button">Sign out</button>
    </div>
  </nav>
  <script type="module" src="/js/theme.mjs"></script>

  <div class="dash-head">
    <h1>Your sessions</h1>
    <button class="btn primary" id="buy" type="button">+ New session</button>
  </div>

  <div class="sessions" id="sessions"></div>
  <div class="empty hidden" id="empty">
    <p>No sessions yet.</p>
    <button class="btn primary" id="buyEmpty" type="button">Buy your first session</button>
  </div>
</div>

<div class="modal-backdrop hidden" id="nameModal">
  <div class="modal card" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle">
    <h2 id="nameModalTitle">Name this session</h2>
    <input class="modal-input" id="sessionName" type="text" placeholder="Session name" autocomplete="off" maxlength="60">
    <div class="modal-actions">
      <button class="btn ghost" id="nameCancel" type="button">Cancel</button>
      <button class="btn primary" id="nameOk" type="button">Continue</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<script type="module" src="/js/dashboard.mjs"></script>
</body>
</html>
