<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Booth · Host</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/host.css">
</head>
<body class="host">
<header class="host-top">
  <h1 id="hostName">Photo Booth · Host</h1>
  <span class="pill" id="modePill">—</span>
</header>

<main class="host-grid">
  <section class="panel join">
    <h2>Guests join here</h2>
    <canvas id="qr" aria-label="QR code for the booth URL"></canvas>
    <p class="url" id="joinUrl">—</p>
    <select id="urlPick" class="text-input hidden" aria-label="Booth address"></select>
    <p class="hint">Everyone must be on the same Wi-Fi as this Mac. No internet needed.</p>
  </section>

  <section class="panel">
    <h2>Printer</h2>
    <label class="field"><span>Destination</span>
      <select id="printerPick" class="text-input"></select>
    </label>
    <label class="field"><span>Paper</span>
      <select id="mediaPick" class="text-input">
        <option value="Custom.4x6in">4×6 in (photo)</option>
        <option value="Custom.6x4in">6×4 in (photo, landscape)</option>
        <option value="Custom.2x6in">2×6 in (strip stock)</option>
        <option value="Custom.5x7in">5×7 in</option>
        <option value="Letter">US Letter</option>
        <option value="A4">A4</option>
      </select>
    </label>
    <label class="switch"><input type="checkbox" id="fitToPage"> <span>Scale to fill the sheet</span></label>
    <label class="switch"><input type="checkbox" id="printingEnabled"> <span>Printing is on</span></label>
    <label class="switch"><input type="checkbox" id="requireApproval"> <span>Ask me before each print</span></label>
    <label class="field"><span>Max copies per guest</span>
      <input id="maxCopies" class="text-input" type="number" min="1" max="10">
    </label>
    <label class="field"><span>Booth name</span>
      <input id="boothNameInput" class="text-input" type="text" maxlength="40">
    </label>
    <label class="field"><span>Welcome line</span>
      <input id="messageInput" class="text-input" type="text" maxlength="120">
    </label>
    <button class="btn btn-primary wide" id="saveConfig" type="button">Save settings</button>
    <p class="hint" id="printerHint"></p>
  </section>

  <section class="panel">
    <h2>Waiting for you <span class="pill" id="pendingCount">0</span></h2>
    <div id="pending" class="job-list"><p class="hint">Nothing waiting.</p></div>
  </section>

  <section class="panel">
    <h2>Printer queue</h2>
    <div id="cupsQueue" class="job-list"><p class="hint">Queue is empty.</p></div>
    <h2 class="spaced">Recent strips</h2>
    <div id="recent" class="gallery"></div>
  </section>
</main>

<div class="toast hidden" id="toast"></div>
<script type="module" src="/js/host.mjs"></script>
</body>
</html>
