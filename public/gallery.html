<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Booth · All photos</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/host.css">
</head>
<body class="host">
<header class="host-top">
  <h1>All photos</h1>
  <div class="host-pills">
    <a class="pill" href="/host">← Host</a>
    <span class="pill quiet" id="count">…</span>
  </div>
</header>

<main class="host-grid">
  <section class="panel">
    <div class="gallery-actions">
      <button class="btn btn-primary" id="downloadAll" type="button">Download all (.zip)</button>
      <button class="btn btn-ghost" id="refresh" type="button">Refresh</button>
    </div>
    <p class="hint" id="summary">Loading…</p>

    <div class="signin hidden" id="signin">
      <p class="hint">Enter the booth token to see the photos.</p>
      <input class="text-input" id="tokenInput" type="password" placeholder="Booth token" autocomplete="off">
      <button class="btn btn-primary" id="signinBtn" type="button">Show photos</button>
    </div>

    <!-- Appears when one or more photos are ticked -->
    <div class="sel-bar hidden" id="selBar">
      <span id="selCount">0 selected</span>
      <div class="sel-actions">
        <button class="btn btn-ghost" id="selDownload" type="button">Download</button>
        <button class="btn btn-ghost" id="selReprint" type="button">Reprint → queue</button>
        <button class="btn btn-ghost" id="selClear" type="button">Clear</button>
      </div>
    </div>

    <div class="gallery gallery-lg" id="grid"></div>
  </section>
</main>

<!-- Per-photo detail -->
<div class="sheet hidden" id="detail">
  <div class="detail-card">
    <button class="detail-close" id="detailClose" type="button" aria-label="Close">✕</button>
    <img id="detailImg" alt="">
    <h2 id="detailName">Photo</h2>
    <dl class="detail-meta">
      <div><dt>Status</dt><dd><span class="badge" id="detailStatus">…</span></dd></div>
      <div><dt>Printer</dt><dd id="detailPrinter">-</dd></div>
      <div><dt>Time</dt><dd id="detailTime">-</dd></div>
    </dl>
    <div class="detail-actions">
      <button class="btn btn-primary" id="reprintFront" type="button">Reprint now (front)</button>
      <button class="btn btn-ghost" id="reprintQueue" type="button">Reprint → queue</button>
      <a class="btn btn-ghost" id="detailDownload" download>Download</a>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<script type="module" src="/js/gallery.mjs"></script>
</body>
</html>
