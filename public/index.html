<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#15111b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Photo Booth</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 id="boothName">Photo Booth</h1>
  </header>

  <section class="stage" aria-label="Print preview">
    <div class="paper-shadow" id="singleWrap">
      <canvas id="preview" aria-label="Live preview of your print"></canvas>
      <div class="pick-overlay" id="pickOverlay">
        <button class="btn btn-primary btn-pick" id="addAll" type="button">
          <span id="pickLabel">Pick your 4 photos</span>
        </button>
      </div>
    </div>

    <div class="coverflow hidden" id="coverflow" aria-label="Choose a design — swipe left or right">
      <div class="cf-track" id="cfTrack"></div>
    </div>
  </section>

  <section class="pick">
    <button class="btn btn-ghost wide hidden" id="swapAll" type="button">Swap all 4 photos</button>
    <p class="hint problem hidden" id="printProblem"></p>
  </section>

  <p class="version" id="version">&nbsp;</p>
  <div class="spacer"></div>
</div>

<div class="actionbar">
  <button class="btn btn-ghost" id="saveBtn" type="button">Save</button>
  <button class="btn btn-fb" id="fbBtn" type="button" disabled aria-label="Share on Facebook">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
  </button>
  <button class="btn btn-primary" id="printBtn" type="button" disabled>Print</button>
</div>

<div class="sheet hidden" id="editor" role="dialog" aria-modal="true" aria-label="Adjust photo">
  <div class="sheet-card">
    <div class="sheet-head">
      <h2>Adjust photo <span id="editorIndex" class="pill"></span></h2>
      <button class="icon-btn" id="editorClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="crop-wrap">
      <canvas id="cropCanvas"></canvas>
      <p class="crop-hint">Drag to move · pinch or slide to zoom</p>
    </div>
    <input id="zoom" class="slider" type="range" min="1" max="3" step="0.01" value="1" aria-label="Zoom">
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="rotateBtn" type="button">Rotate</button>
      <button class="btn btn-ghost" id="resetBtn" type="button">Reset</button>
      <button class="btn btn-ghost" id="replaceBtn" type="button">Replace</button>
      <button class="btn btn-ghost danger" id="removeBtn" type="button">Remove</button>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="makeHero" type="button">★ Make this the big one</button>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="moveLeft" type="button">← Move back</button>
      <button class="btn btn-ghost" id="moveRight" type="button">Move forward →</button>
    </div>
    <button class="btn btn-primary wide" id="editorDone" type="button">Done</button>
  </div>
</div>

<div class="overlay hidden" id="saveSheet" role="dialog" aria-modal="true" aria-label="Save to your photos">
  <div class="save-card">
    <h2>Save to your photos</h2>
    <p class="save-how">Touch and hold the photo, then tap <strong>Save to Photos</strong>. It goes straight to your camera roll.</p>
    <img id="saveImage" class="save-image" alt="Your photo — touch and hold to save">
    <div class="result-actions">
      <button class="btn btn-ghost" id="saveShare" type="button">Share instead</button>
      <button class="btn btn-primary" id="saveClose" type="button">Done</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="result" role="dialog" aria-modal="true">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🖨️</div>
    <h2 id="resultTitle">Sending to the printer…</h2>
    <p id="resultBody">Hold tight.</p>
    <img id="resultImage" alt="Your print" class="result-image hidden">
    <div class="result-actions">
      <button class="btn btn-ghost" id="resultSave" type="button">Save to phone</button>
      <button class="btn btn-primary" id="resultDone" type="button">Done</button>
    </div>
  </div>
</div>

<input id="filePicker" type="file" accept="image/*" multiple hidden>
<input id="fileOne" type="file" accept="image/*" hidden>

<div class="toast hidden" id="toast"></div>

<script type="module" src="/js/app.mjs"></script>
</body>
</html>
