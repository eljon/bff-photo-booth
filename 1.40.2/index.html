<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#15111b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Photo Booth</title>
<style>
:root {
  --bg: #15111b;
  --bg-soft: #1e1826;
  --card: #241d2e;
  --line: #372c45;
  --ink: #f6f1ef;
  --ink-dim: #b3a7bd;
  --accent: #ff5c7a;
  --accent-ink: #2a0b13;
  --ok: #5ad1a5;
  --warn: #ffb020;
  --radius: 18px;
  --bar-h: 84px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}

body {
  min-height: 100dvh;
  background:
    radial-gradient(120% 60% at 50% 0%, #2a1f36 0%, transparent 60%),
    var(--bg);
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: max(14px, env(safe-area-inset-top)) 16px 0;
}

.topbar { text-align: center; padding: 10px 0 14px; }
.topbar h1 {
  margin: 0;
  font-size: 26px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 800;
}
.topbar p { margin: 6px 0 0; color: var(--ink-dim); font-size: 14px; }

/* ---------------------------------------------------------------- preview */

.stage { display: flex; flex-direction: column; align-items: center; }

.paper-shadow {
  position: relative;
  padding: 10px;
  border-radius: 10px;
  background: linear-gradient(180deg, #ffffff10, #ffffff05);
  box-shadow: 0 18px 40px -18px #000, 0 0 0 1px var(--line);
}

#preview {
  display: block;
  max-width: min(78vw, 300px);
  max-height: 46vh;
  width: auto;
  height: auto;
  border-radius: 4px;
  background: #fff;
}

.paper-note { color: var(--ink-dim); font-size: 12px; margin: 10px 0 2px; letter-spacing: 0.08em; text-transform: uppercase; }

/* ---------------------------------------------------------------- coverflow */

.coverflow {
  position: relative;
  width: 100%;
  height: 62vh;
  max-height: 560px;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1100px;
  overflow: hidden;
  /* Vertical page scroll is allowed here by default; only the picture cards
     (.cf-card, below) lock it, so touching the reflection or the empty margins
     scrolls the page while a swipe/pinch on a picture does not. */
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* Shared 3D space: cards stack by real depth (translateZ), so as a card nears the
   centre it rises smoothly to the front — the hand-off happens continuously where
   the cards meet, with no hard z-index pop. */
.cf-track {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}

/* Position is driven every frame by JS, so no CSS transition here — it would lag
   behind and fight the animation. No drop shadow: it would sit under the card and
   darken the top of the reflection, opening a fake gap; the mirror grounds it. */
.cf-card {
  position: absolute;
  /* Baseline is a fixed fraction of the container, so every card's bottom edge
     lands on the same line — the "glass". A portrait card is taller than a
     landscape one, but both rest on this line, so their reflections line up. */
  top: 68%;
  left: 50%;
  border-radius: 6px;
  /* Scale and rotate pivot about the bottom-centre, so shrinking a side card or
     tilting it keeps its bottom edge pinned to the glass line. */
  transform-origin: 50% 100%;
  /* We own the gesture on a picture — a swipe or pinch here never scrolls the
     page (the container allows vertical scroll everywhere else). */
  touch-action: none;
  will-change: transform, opacity;
  cursor: pointer;
}
/* The canvas is sized in JS to fit a box while keeping the true paper aspect
   (4×6 stays 4×6, 6×4 stays 6×4). No max-width here — that was clamping the
   width while the height stayed, squishing every card toward square. */
.cf-card canvas {
  display: block;
  border-radius: 6px;
  background: #fff;
}
/* Frosted-glass reflection: a separate blurred, faded copy sitting just below
   the card. Unlike -webkit-box-reflect (a crisp mirror = glossy glass), this can
   be blurred, so it reads as a soft, hazy reflection on frosted glass. It is a
   child of the card, so it tilts and recedes in 3D with it. The image is drawn
   pre-flipped in JS; the mask fades it out quickly (short) and it is faint
   (subtle). It never intercepts taps. */
.cf-mirror {
  position: absolute;
  top: 100%;
  left: 0;
  border-radius: 6px;
  pointer-events: none;
  opacity: 0.22;
  filter: blur(3.5px);
  transform-origin: center center; /* a pinch mirrors the paper's transform about here */
  will-change: transform;
  /* Behind the print: when a pinch makes the paper and its reflection overlap,
     the reflection must sit under the picture, not paint over it. */
  z-index: -1;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 38%);
  mask-image: linear-gradient(to bottom, #000 0%, transparent 38%);
}
/* The paper: a pinch scales/rotates/moves this (a view only), around its centre,
   without disturbing the card's coverflow position. It holds both the print face
   and its reflection, so a pinch zooms them together; the container keeps its
   overflow clipping, so the deck's clean left/right edges stay put. */
.cf-paper {
  transform-origin: center center;
  will-change: transform;
}
.cf-label {
  text-align: center;
  margin: 12px 0 2px;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
}
.cf-label .cf-count { color: var(--ink-dim); font-weight: 500; font-size: 12px; margin-left: 6px; }

/* ---------------------------------------------------------------- panels */

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 16px;
}

.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.panel-head h2 { margin: 0; font-size: 15px; text-transform: uppercase; letter-spacing: 0.12em; }
.sub { margin: 16px 0 8px; font-size: 12px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
.hint { color: var(--ink-dim); font-size: 13px; line-height: 1.45; margin: 12px 0 0; }

.pill {
  font-size: 12px;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 999px;
  background: #ffffff12;
  color: var(--ink);
}
.pill.quiet { background: transparent; border: 1px solid var(--line); color: var(--ink-dim); font-weight: 500; }
.pill.good { background: #5ad1a520; color: var(--ok); }
.pill.bad { background: #ff5c7a20; color: var(--accent); }

/* ---------------------------------------------------------------- slots */

.pick { margin-top: 16px; }
.hint.problem { color: var(--accent); }

/* The one button lives on top of the print itself, so there is never an empty
   grid sitting next to a button asking to fill it. */
.pick-overlay {
  position: absolute;
  inset: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  border-radius: 4px;
  background: #15111ba6;
  backdrop-filter: blur(1.5px);
  transition: background 0.18s ease;
}
.btn-pick {
  max-width: 100%;
  padding: 15px 22px;
  font-size: 16px;
  white-space: nowrap;
  box-shadow: 0 8px 22px -10px #000c;
}

/* Once the print is full, get out of the way of it. */
.pick-overlay.compact {
  align-items: flex-end;
  justify-content: center;
  background: transparent;
  backdrop-filter: none;
  pointer-events: none;
}
.pick-overlay.compact .btn-pick {
  pointer-events: auto;
  padding: 9px 15px;
  font-size: 13px;
  border-radius: 999px;
  background: #15111bd9;
  color: var(--ink);
  backdrop-filter: blur(6px);
}

.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }

.slot {
  position: relative;
  aspect-ratio: 3 / 4;
  border-radius: 12px;
  border: 1px dashed var(--line);
  background: var(--bg-soft);
  color: var(--ink-dim);
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 0;
  cursor: pointer;
  opacity: 0.7;
  -webkit-tap-highlight-color: transparent;
}
.slot.filled { opacity: 1; }
.slot canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.slot:disabled { cursor: default; font-size: 13px; font-weight: 700; opacity: 0.45; }
.slot.filled { border-style: solid; border-color: transparent; }
.slot .num {
  position: absolute;
  left: 5px;
  top: 4px;
  font-size: 10px;
  font-weight: 800;
  background: #00000090;
  color: #fff;
  border-radius: 6px;
  padding: 2px 5px;
}

/* ------------------------------------------------------- forms (host page) */

.text-input {
  width: 100%;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-soft);
  color: var(--ink);
  padding: 13px 14px;
  font-size: 16px;
  font-family: inherit;
}
.text-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------------------------------------------------------------- buttons */

.btn {
  border: 0;
  border-radius: 14px;
  padding: 15px 18px;
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: #ffffff12; color: var(--ink); }
.btn-ghost.danger { color: var(--accent); }
.btn-add { width: 100%; margin-top: 14px; background: #ffffff12; color: var(--ink); }
.btn-icon { font-weight: 800; }
.wide { width: 100%; margin-top: 12px; }

.version {
  text-align: center;
  color: var(--ink-dim);
  opacity: 0.5;
  font-size: 11px;
  letter-spacing: 0.08em;
  margin: 20px 0 0;
}

.spacer { height: calc(var(--bar-h) + env(safe-area-inset-bottom) + 20px); }

.actionbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  gap: 10px;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, #15111b00, #15111be6 22%, var(--bg) 60%);
  backdrop-filter: blur(8px);
}
.actionbar { align-items: stretch; }
.actionbar .btn { white-space: nowrap; } /* never wrap to a taller button and stretch the row */
.actionbar .btn-primary { flex: 1; }
.actionbar .btn-ghost { flex: 0 0 84px; }
.btn-fb {
  flex: 0 0 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  background: #1877f2;
  color: #fff;
}
.btn-fb svg { display: block; }

/* ---------------------------------------------------------------- sheet */

.sheet, .overlay {
  position: fixed;
  inset: 0;
  background: #0b0810cc;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 20;
  backdrop-filter: blur(6px);
}
.overlay { align-items: center; padding: 20px; }
.hidden { display: none !important; }

/* Collapsed print-status chip — shown when the guest taps Done while a print is
   still in the queue, so they can keep browsing and watch their place. */
.queue-pill {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--bar-h) + 14px + env(safe-area-inset-bottom));
  z-index: 15;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: calc(100vw - 32px);
  padding: 11px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 10px 30px #0008;
  cursor: pointer;
}
.queue-pill:active { transform: translateX(-50%) scale(0.97); }

.sheet-card {
  width: 100%;
  max-width: 560px;
  background: var(--card);
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--line);
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height: 92dvh;
  overflow-y: auto;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { margin: 0; font-size: 16px; text-transform: uppercase; letter-spacing: 0.1em; }
.icon-btn { border: 0; background: #ffffff12; color: var(--ink); width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; }

.crop-wrap { display: flex; flex-direction: column; align-items: center; margin: 14px 0 6px; }
#cropCanvas {
  max-width: min(74vw, 320px);
  max-height: 44dvh;
  border-radius: 10px;
  background: #000;
  touch-action: none;
  cursor: grab;
}
.crop-hint { color: var(--ink-dim); font-size: 12px; margin: 10px 0 0; }

.slider { width: 100%; margin: 10px 0 14px; accent-color: var(--accent); height: 30px; }

.sheet-actions { display: flex; gap: 8px; margin-bottom: 8px; }
.sheet-actions .btn { flex: 1; padding: 13px 8px; font-size: 14px; }

/* ---------------------------------------------------------------- result */

.save-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 22px 20px;
  text-align: center;
  max-width: 420px;
  width: 100%;
}
.save-card h2 { margin: 0 0 6px; font-size: 20px; }
.save-how { margin: 0 0 16px; color: var(--ink-dim); font-size: 14px; line-height: 1.5; }
.save-how strong { color: var(--ink); }
.save-image {
  display: block;
  width: 100%;
  max-width: 260px;
  margin: 0 auto 20px;
  border-radius: 8px;
  box-shadow: 0 12px 30px -14px #000;
  /* let the OS offer its image context menu, and never hijack the long press */
  -webkit-touch-callout: default;
  touch-action: manipulation;
  user-select: none;
}

.result-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 26px 20px;
  text-align: center;
  max-width: 420px;
  width: 100%;
}
.result-emoji { font-size: 44px; }
.result-card h2 { margin: 10px 0 6px; font-size: 21px; }
.result-card p { margin: 0; color: var(--ink-dim); font-size: 15px; line-height: 1.5; }
.result-image { max-width: 150px; margin: 16px auto 0; display: block; border-radius: 6px; box-shadow: 0 10px 24px -12px #000; }
.send-anim { width: 190px; height: 240px; margin: 14px auto 0; display: block; }
.result-actions { display: flex; gap: 10px; margin-top: 22px; }
.result-actions .btn { flex: 1; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--bar-h) + env(safe-area-inset-bottom) + 16px);
  transform: translateX(-50%);
  background: #000000d9;
  color: #fff;
  padding: 12px 18px;
  border-radius: 999px;
  font-size: 14px;
  z-index: 40;
  max-width: 88vw;
  text-align: center;
}

@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise 0.18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 id="boothName">Photo Booth</h1>
    <p id="boothMessage">Pick 4 photos. Take it home.</p>
  </header>

  <section class="stage" aria-label="Print preview">
    <div class="paper-shadow" id="singleWrap">
      <canvas id="preview" aria-label="Live preview of your print"></canvas>
      <div class="pick-overlay" id="pickOverlay">
        <button class="btn btn-primary btn-pick" id="addAll" type="button">
          <span id="pickLabel">Pick your 4 photos</span>
        </button>
      </div>
    </div>

    <div class="coverflow hidden" id="coverflow" aria-label="Choose a design — swipe left or right">
      <div class="cf-track" id="cfTrack"></div>
    </div>

    <p class="cf-label hidden" id="cfLabel"><span id="cfTitle"></span> <span class="cf-count" id="cfCount"></span></p>
  </section>

  <section class="pick">
    <button class="btn btn-ghost wide hidden" id="swapAll" type="button">Swap all 4 photos</button>
    <p class="hint problem hidden" id="printProblem"></p>
  </section>

  <p class="version" id="version">&nbsp;</p>
  <div class="spacer"></div>
</div>

<div class="actionbar">
  <button class="btn btn-ghost" id="saveBtn" type="button">Save</button>
  <button class="btn btn-fb" id="fbBtn" type="button" disabled aria-label="Share on Facebook">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
  </button>
  <button class="btn btn-primary" id="printBtn" type="button" disabled>Print</button>
</div>

<div class="sheet hidden" id="editor" role="dialog" aria-modal="true" aria-label="Adjust photo">
  <div class="sheet-card">
    <div class="sheet-head">
      <h2>Adjust photo <span id="editorIndex" class="pill"></span></h2>
      <button class="icon-btn" id="editorClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="crop-wrap">
      <canvas id="cropCanvas"></canvas>
      <p class="crop-hint">Drag to move · pinch or slide to zoom</p>
    </div>
    <input id="zoom" class="slider" type="range" min="1" max="3" step="0.01" value="1" aria-label="Zoom">
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="rotateBtn" type="button">Rotate</button>
      <button class="btn btn-ghost" id="resetBtn" type="button">Reset</button>
      <button class="btn btn-ghost" id="replaceBtn" type="button">Replace</button>
      <button class="btn btn-ghost danger" id="removeBtn" type="button">Remove</button>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="makeHero" type="button">★ Make this the big one</button>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="moveLeft" type="button">← Move back</button>
      <button class="btn btn-ghost" id="moveRight" type="button">Move forward →</button>
    </div>
    <button class="btn btn-primary wide" id="editorDone" type="button">Done</button>
  </div>
</div>

<div class="overlay hidden" id="saveSheet" role="dialog" aria-modal="true" aria-label="Save to your photos">
  <div class="save-card">
    <h2>Save to your photos</h2>
    <p class="save-how">Touch and hold the photo, then tap <strong>Save to Photos</strong>. It goes straight to your camera roll.</p>
    <img id="saveImage" class="save-image" alt="Your photo — touch and hold to save">
    <div class="result-actions">
      <button class="btn btn-ghost" id="saveShare" type="button">Share instead</button>
      <button class="btn btn-primary" id="saveClose" type="button">Done</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="result" role="dialog" aria-modal="true">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🖨️</div>
    <h2 id="resultTitle">Sending to the printer…</h2>
    <p id="resultBody">Hold tight.</p>
    <img id="resultImage" alt="Your print" class="result-image hidden">
    <canvas id="sendAnim" class="send-anim hidden" aria-hidden="true"></canvas>
    <div class="result-actions">
      <button class="btn btn-ghost" id="resultSave" type="button">Save to phone</button>
      <button class="btn btn-primary" id="resultDone" type="button">Done</button>
    </div>
  </div>
</div>

<button class="queue-pill hidden" id="queuePill" type="button" aria-label="Show print status"></button>

<input id="filePicker" type="file" accept="image/*" multiple hidden>
<input id="fileOne" type="file" accept="image/*" hidden>

<div class="toast hidden" id="toast"></div>

<script type="module">

const __PREVIEW_SESSION = {
  version: "1.40.2", boothName: 'BFF Photo Booth',
  message: 'Pick 4 photos. Take it home.',
  maxCopies: 3, defaultCopies: 1, shareHashtag: '#bff2026',
  printingEnabled: false, requireApproval: false, keyRequired: false,
  remote: false, dryRun: false,
};
const __origFetch = window.fetch.bind(window);
window.fetch = (input, init) => {
  const u = typeof input === 'string' ? input : (input && input.url) || '';
  if (u.includes('/api/session')) return Promise.resolve(new Response(JSON.stringify(__PREVIEW_SESSION), { status: 200, headers: { 'content-type': 'application/json' } }));
  if (u.includes('/api/')) return Promise.resolve(new Response(JSON.stringify({ ok: false, error: 'Preview mode — printing needs the booth.' }), { status: 503, headers: { 'content-type': 'application/json' } }));
  return __origFetch(input, init);
};


/* ===== js/filters.mjs ===== */
// Photo looks. ctx.filter is used where the browser supports it (fast, GPU
// backed); older iOS Safari falls back to the equivalent per-pixel maths so a
// guest on an old phone still gets the same print.

const FILTERS = {
  none: { id: 'none', name: 'True', css: 'none' },
  bw: { id: 'bw', name: 'B&W', css: 'grayscale(1) contrast(1.08)' },
  noir: { id: 'noir', name: 'Noir', css: 'grayscale(1) contrast(1.35) brightness(0.96)' },
  warm: { id: 'warm', name: 'Warm', css: 'saturate(1.12) sepia(0.18) brightness(1.03)' },
  cool: { id: 'cool', name: 'Cool', css: 'saturate(1.05) hue-rotate(-8deg) brightness(1.02)' },
  fade: { id: 'fade', name: 'Faded', css: 'contrast(0.88) saturate(0.85) brightness(1.08)' },
};

const FILTER_ORDER = ['none', 'bw', 'noir', 'warm', 'cool', 'fade'];

let ctxFilterSupported = null;

function supportsCtxFilter() {
  if (ctxFilterSupported !== null) return ctxFilterSupported;
  try {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.filter = 'grayscale(1)';
    ctxFilterSupported = ctx.filter === 'grayscale(1)';
  } catch {
    ctxFilterSupported = false;
  }
  return ctxFilterSupported;
}

const clamp = (v) => (v < 0 ? 0 : v > 255 ? 255 : v);

const PIXEL_OPS = {
  none: null,
  bw: (r, g, b) => {
    const y = 0.299 * r + 0.587 * g + 0.114 * b;
    const c = (y - 128) * 1.08 + 128;
    return [c, c, c];
  },
  noir: (r, g, b) => {
    const y = 0.299 * r + 0.587 * g + 0.114 * b;
    const c = ((y - 128) * 1.35 + 128) * 0.96;
    return [c, c, c];
  },
  warm: (r, g, b) => [r * 1.07 + 8, g * 1.02 + 2, b * 0.93],
  cool: (r, g, b) => [r * 0.93, g * 1.0, b * 1.09 + 6],
  fade: (r, g, b) => {
    const y = 0.299 * r + 0.587 * g + 0.114 * b;
    const mix = (v) => (v * 0.85 + y * 0.15) * 0.88 + 30;
    return [mix(r), mix(g), mix(b)];
  },
};

/** Apply a filter preset to a whole canvas in place (fallback path). */
function applyPixelFilter(canvas, filterId) {
  const op = PIXEL_OPS[filterId];
  if (!op) return;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = image.data;
  for (let i = 0; i < d.length; i += 4) {
    const [r, g, b] = op(d[i], d[i + 1], d[i + 2]);
    d[i] = clamp(r);
    d[i + 1] = clamp(g);
    d[i + 2] = clamp(b);
  }
  ctx.putImageData(image, 0, 0);
}


/* ===== js/layouts.mjs ===== */
// Print layouts. Every page is described in real pixels at 300 DPI, so the
// canvas we compose on the phone is literally the file that goes to the tray.

const DPI = 300;
const inches = (n) => Math.round(n * DPI);

function stripLayout() {
  // Two identical 2x6 strips on one 4x6 sheet — cut down the middle.
  const page = { w: inches(4), h: inches(6) };
  const stripW = page.w / 2;
  const pad = 44;
  const gap = 22;
  const footer = 150;
  const cellW = stripW - pad * 2;
  const cellH = Math.floor((page.h - pad * 2 - footer - gap * 3) / 4);
  const cells = [];
  for (let copy = 0; copy < 2; copy++) {
    for (let i = 0; i < 4; i++) {
      cells.push({
        x: copy * stripW + pad,
        y: pad + i * (cellH + gap),
        w: cellW,
        h: cellH,
        photo: i,
      });
    }
  }
  const captionY = pad + 4 * cellH + 3 * gap;
  return {
    id: 'strip',
    name: 'Classic strip',
    blurb: 'Two 2×6 strips on one 4×6 — keep one, give one away',
    paper: '4×6 portrait',
    media: 'Custom.4x6in',
    page,
    cells,
    captions: [
      { x: pad, y: captionY, w: cellW, h: page.h - pad - captionY },
      { x: stripW + pad, y: captionY, w: cellW, h: page.h - pad - captionY },
    ],
    cutLine: { x: stripW, y1: 0, y2: page.h },
  };
}

function gridLayout() {
  // Cells are computed per print from the real photos (see resolveGrid), so a
  // mix of portrait and landscape shots each fit without cropping. The static
  // values here are just the defaults; resolveGrid fills the sheet edge to edge.
  const page = { w: inches(4), h: inches(6) };
  return {
    id: 'grid',
    name: 'Auto grid',
    blurb: 'One big hero photo with three beside it — nothing cropped',
    paper: '4×6 portrait',
    media: 'Custom.4x6in',
    page,
    dynamic: true,
    cells: [], // filled in by resolveGrid at render time
    captions: [],
    cutLine: null,
  };
}

/** Aspect ratio (w/h) a photo occupies, honouring a 90° rotation. */
function photoAspect(photo) {
  if (!photo || !photo.bitmap) return 3 / 4; // an empty slot stands in as portrait
  const t = photo.transform || {};
  const swap = Math.abs((t.rot || 0) % 180) === 90;
  const w = swap ? photo.bitmap.height : photo.bitmap.width;
  const h = swap ? photo.bitmap.width : photo.bitmap.height;
  return w / h || 3 / 4;
}

const PORTRAIT_4X6 = { w: inches(4), h: inches(6), media: 'Custom.4x6in', paper: '4×6 portrait' };
const LANDSCAPE_6X4 = { w: inches(6), h: inches(4), media: 'Custom.6x4in', paper: '6×4 landscape' };

const GAP = 26; // uniform gutter between photos, in print pixels

/**
 * Lay groups of photos out as justified ROWS. Every cell is shaped to its own
 * photo's aspect ratio, so a contain-fit fills it exactly — no matting inside a
 * frame, no skew, and every photo keeps its true orientation. Each row is scaled
 * so the photos in it span the full width edge to edge (they touch, save for the
 * gutter). The stack of rows is scaled to fit the sheet and centred, so the only
 * whitespace is one thin, even margin on the axis the shapes could not fill.
 */
function justifyRows(page, groups, aspects) {
  const W = page.w;
  const H = page.h;
  const rows = groups.map((g) => {
    const sumA = g.reduce((s, i) => s + aspects[i], 0);
    return { g, h: (W - GAP * (g.length - 1)) / sumA };
  });
  const naturalH = rows.reduce((s, r) => s + r.h, 0) + GAP * (rows.length - 1);
  const scale = naturalH > H ? H / naturalH : 1;
  const finalW = W * scale;
  const finalH = naturalH * scale;
  const x0 = (W - finalW) / 2;
  let y = (H - finalH) / 2;

  const cells = [];
  for (const r of rows) {
    const h = r.h * scale;
    let x = x0;
    for (const i of r.g) {
      const w = aspects[i] * h;
      cells.push({ x, y, w, h, photo: i, fit: 'contain' });
      x += w + GAP * scale;
    }
    y += h + GAP * scale;
  }
  const area = cells.reduce((s, c) => s + c.w * c.h, 0);
  return { cells, coverage: area / (W * H) };
}

/** As justifyRows, but as COLUMNS: each group fills the full height, side by side. */
function justifyCols(page, groups, aspects) {
  const W = page.w;
  const H = page.h;
  const cols = groups.map((g) => {
    const sumInv = g.reduce((s, i) => s + 1 / aspects[i], 0);
    return { g, w: (H - GAP * (g.length - 1)) / sumInv };
  });
  const naturalW = cols.reduce((s, c) => s + c.w, 0) + GAP * (cols.length - 1);
  const scale = naturalW > W ? W / naturalW : 1;
  const finalW = naturalW * scale;
  const finalH = H * scale;
  const y0 = (H - finalH) / 2;
  let x = (W - finalW) / 2;

  const cells = [];
  for (const c of cols) {
    const w = c.w * scale;
    let y = y0;
    for (const i of c.g) {
      const h = w / aspects[i];
      cells.push({ x, y, w, h, photo: i, fit: 'contain' });
      y += h + GAP * scale;
    }
    x += w + GAP * scale;
  }
  const area = cells.reduce((s, c) => s + c.w * c.h, 0);
  return { cells, coverage: area / (W * H) };
}

/**
 * The best hero design for one photo: try the hero along the top, the bottom,
 * the left and the right, on both sheets, and keep whichever fills the most
 * paper. Because cells are shaped to their photos, "most paper filled" is the
 * layout with the least whitespace — nothing is cropped and nothing is skewed.
 */
function heroDesign(aspects, heroIndex) {
  const others = aspects.map((_, i) => i).filter((i) => i !== heroIndex);
  const plans = [
    { arrange: 'top', fn: justifyRows, groups: [[heroIndex], others] },
    { arrange: 'bottom', fn: justifyRows, groups: [others, [heroIndex]] },
    { arrange: 'left', fn: justifyCols, groups: [[heroIndex], others] },
    { arrange: 'right', fn: justifyCols, groups: [others, [heroIndex]] },
  ];
  let best = null;
  for (const paper of [PORTRAIT_4X6, LANDSCAPE_6X4]) {
    const page = { w: paper.w, h: paper.h };
    for (const plan of plans) {
      const laid = plan.fn(page, plan.groups, aspects);
      if (!best || laid.coverage > best.coverage) {
        best = { ...laid, page, media: paper.media, paper: paper.paper, arrange: plan.arrange };
      }
    }
  }
  // Hero cell first, whatever the placement — downstream code reads cells[0] as
  // the hero (the crop editor, the "biggest photo" checks).
  best.cells.sort((a, b) => (a.photo === heroIndex ? -1 : b.photo === heroIndex ? 1 : a.photo - b.photo));
  return best;
}

/** Best no-hero layout: the four photos packed to fill the sheet as fully as they can. */
function evenGrid(aspects) {
  const plans = [
    (p) => justifyRows(p, [[0, 1], [2, 3]], aspects),
    (p) => justifyCols(p, [[0, 2], [1, 3]], aspects),
    (p) => justifyRows(p, [[0, 1, 2, 3]], aspects),
    (p) => justifyCols(p, [[0], [1], [2], [3]], aspects),
  ];
  let best = null;
  for (const paper of [PORTRAIT_4X6, LANDSCAPE_6X4]) {
    const page = { w: paper.w, h: paper.h };
    for (const fn of plans) {
      const laid = fn(page);
      if (!best || laid.coverage > best.coverage) {
        best = { ...laid, page, media: paper.media, paper: paper.paper };
      }
    }
  }
  return best;
}

const ARRANGE_SUB = { top: 'on top', bottom: 'on the bottom', left: 'on the left', right: 'on the right' };

/**
 * The booth's own pick: photo 0 as the hero (unless told otherwise), in the
 * placement and on the sheet that fill the most paper without cropping.
 */
function resolveGrid(base, photos, heroIndex = 0) {
  const d = heroDesign(photos.map(photoAspect), heroIndex);
  return { cells: d.cells, captions: [], page: d.page, media: d.media, paper: d.paper };
}

/**
 * The designs offered as cards in the picker: each photo as the big hero (placed
 * and sized to fill the most paper), plus an even layout with no hero. Photo 0
 * leads, so the default card matches resolveGrid. Every design shapes its cells
 * to the real photos, so nothing is cropped, nothing is skewed, and the only
 * whitespace is one thin even margin.
 */
function designVariants(base, photos) {
  const aspects = photos.map(photoAspect);

  const out = photos.map((_, hero) => {
    const d = heroDesign(aspects, hero);
    return {
      key: `hero:${hero}`,
      kind: 'hero',
      heroIndex: hero,
      arrange: d.arrange,
      title: `Big #${hero + 1}`,
      sub: ARRANGE_SUB[d.arrange],
      captions: [],
      cells: d.cells,
      page: d.page,
      media: d.media,
      paper: d.paper,
    };
  });

  out.push({ key: 'even', kind: 'even', title: 'Four equal', sub: 'no big one', captions: [], ...evenGrid(aspects) });
  return out;
}

function filmstripLayout() {
  // Four tall frames across a 6x4 landscape sheet.
  const page = { w: inches(6), h: inches(4) };
  const pad = 56;
  const gap = 24;
  const footer = 132;
  const cellW = Math.floor((page.w - pad * 2 - gap * 3) / 4);
  const cellH = page.h - pad * 2 - footer;
  const cells = [];
  for (let i = 0; i < 4; i++) {
    cells.push({ x: pad + i * (cellW + gap), y: pad, w: cellW, h: cellH, photo: i });
  }
  const captionY = pad + cellH;
  return {
    id: 'filmstrip',
    name: 'Wide filmstrip',
    blurb: 'Four tall frames on a 6×4 landscape print',
    paper: '6×4 landscape',
    media: 'Custom.6x4in',
    page,
    cells,
    captions: [{ x: pad, y: captionY, w: page.w - pad * 2, h: page.h - pad - captionY }],
    cutLine: null,
  };
}

const LAYOUTS = {
  strip: stripLayout(),
  grid: gridLayout(),
  filmstrip: filmstripLayout(),
};

const LAYOUT_ORDER = ['strip', 'grid', 'filmstrip'];

const FRAMES = {
  white: { id: 'white', name: 'White', bg: '#ffffff', ink: '#101010', accent: '#9a9a9a' },
  black: { id: 'black', name: 'Black', bg: '#111111', ink: '#f5f5f5', accent: '#8a8a8a' },
  cream: { id: 'cream', name: 'Cream', bg: '#f4ece0', ink: '#4a3b2c', accent: '#b9a68e' },
  blush: { id: 'blush', name: 'Blush', bg: '#f7dfe4', ink: '#7a3b48', accent: '#c98d9c' },
};

const DEFAULT_TRANSFORM = { zoom: 1, dx: 0, dy: 0, rot: 0 };


/* ===== js/render.mjs ===== */

const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';

/**
 * The smallest scale at which the photo, rotated by `rot`, still fully covers
 * the cell — so a rotated crop never leaves a blank corner. A rotated rectangle
 * of source size (W×H)·scale covers a cell (cellW×cellH) when, along each of the
 * photo's own axes, its half-extent clears the cell's rotated footprint:
 *   W·scale/2 ≥ (cellW·|cos| + cellH·|sin|)/2, and the same for H with axes swapped.
 * For an unrotated `contain` cell (the layout shapes each cell to its photo) that
 * reduces to the exact fit, so nothing crops until the guest zooms or rotates.
 */
function coverBase(cellW, cellH, W, H, rot, fit) {
  if (fit === 'contain' && rot % 360 === 0) return Math.min(cellW / W, cellH / H);
  const rad = (rot * Math.PI) / 180;
  const c = Math.abs(Math.cos(rad));
  const s = Math.abs(Math.sin(rad));
  return Math.max((cellW * c + cellH * s) / W, (cellW * s + cellH * c) / H);
}

/**
 * Keep a crop inside its cell: however the guest zooms, pans, or rotates, the
 * photo still covers the frame, so a print can never come out with a sliver of
 * blank paper. Pan is clamped in the photo's own (rotated) frame, then mapped
 * back to page axes, so the reachable range is correct at any angle.
 */
function clampTransform(transform, cellW, cellH, bitmap, fit = 'cover') {
  const t = { zoom: 1, dx: 0, dy: 0, rot: 0, ...transform };
  t.zoom = Math.min(4, Math.max(1, t.zoom));
  const rad = (t.rot * Math.PI) / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  const scale = coverBase(cellW, cellH, bitmap.width, bitmap.height, t.rot, fit) * t.zoom;

  // Half the cell's footprint measured along the photo's own axes.
  const needX = (cellW * Math.abs(cos) + cellH * Math.abs(sin)) / 2;
  const needY = (cellW * Math.abs(sin) + cellH * Math.abs(cos)) / 2;
  const slackX = Math.max(0, (bitmap.width * scale) / 2 - needX);
  const slackY = Math.max(0, (bitmap.height * scale) / 2 - needY);

  // Pan is stored as page-frame fractions of the cell. Rotate it into the photo
  // frame to clamp against the slack, then rotate it back.
  const px = t.dx * cellW;
  const py = t.dy * cellH;
  let lx = px * cos + py * sin;
  let ly = -px * sin + py * cos;
  lx = Math.min(slackX, Math.max(-slackX, lx));
  ly = Math.min(slackY, Math.max(-slackY, ly));
  t.dx = cellW ? (lx * cos - ly * sin) / cellW : 0;
  t.dy = cellH ? (lx * sin + ly * cos) / cellH : 0;
  return t;
}

/** Draw one photo, cover-fitted into a cell and honouring the guest's crop. */
function drawPhoto(ctx, cell, photo, filterId) {
  const { bitmap } = photo;
  const fit = cell.fit || 'cover';
  const t = clampTransform(photo.transform, cell.w, cell.h, bitmap, fit);
  const nw = bitmap.width;
  const nh = bitmap.height;
  const scale = coverBase(cell.w, cell.h, nw, nh, t.rot, fit) * t.zoom;

  ctx.save();
  ctx.beginPath();
  ctx.rect(cell.x, cell.y, cell.w, cell.h);
  ctx.clip();

  const useCtxFilter = filterId !== 'none' && supportsCtxFilter();
  if (useCtxFilter) ctx.filter = FILTERS[filterId].css;

  ctx.translate(cell.x + cell.w / 2 + t.dx * cell.w, cell.y + cell.h / 2 + t.dy * cell.h);
  ctx.rotate((t.rot * Math.PI) / 180);
  ctx.drawImage(bitmap, (-nw * scale) / 2, (-nh * scale) / 2, nw * scale, nh * scale);
  ctx.restore();

  if (filterId !== 'none' && !useCtxFilter) {
    // Older Safari: redo this cell through the pixel path.
    const tile = document.createElement('canvas');
    tile.width = Math.max(1, Math.round(cell.w));
    tile.height = Math.max(1, Math.round(cell.h));
    const tctx = tile.getContext('2d', { willReadFrequently: true });
    tctx.translate(tile.width / 2 + t.dx * cell.w, tile.height / 2 + t.dy * cell.h);
    tctx.rotate((t.rot * Math.PI) / 180);
    tctx.drawImage(bitmap, (-nw * scale) / 2, (-nh * scale) / 2, nw * scale, nh * scale);
    applyPixelFilter(tile, filterId);
    ctx.drawImage(tile, cell.x, cell.y, cell.w, cell.h);
  }
}

function drawPlaceholder(ctx, cell, index, frame) {
  ctx.save();
  ctx.strokeStyle = frame.accent;
  ctx.fillStyle = frame.accent;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = Math.max(2, cell.w * 0.012);
  ctx.setLineDash([cell.w * 0.06, cell.w * 0.04]);
  ctx.strokeRect(cell.x + 4, cell.y + 4, cell.w - 8, cell.h - 8);
  ctx.setLineDash([]);
  ctx.globalAlpha = 0.55;
  ctx.font = `600 ${Math.round(Math.min(cell.w, cell.h) * 0.3)}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(index + 1), cell.x + cell.w / 2, cell.y + cell.h / 2);
  ctx.restore();
}

/**
 * Shrink text until it fits its block. Letter spacing has to be applied before
 * measuring, or a tracked-out footer runs off the edge of the paper.
 */
function fitText(ctx, text, maxWidth, startSize, weight, spacingRatio = 0) {
  let size = startSize;
  const apply = () => {
    ctx.font = `${weight} ${size}px ${FONT}`;
    ctx.letterSpacing = `${Math.round(size * spacingRatio)}px`;
  };
  apply();
  while (size > 10 && ctx.measureText(text).width > maxWidth) {
    size -= 2;
    apply();
  }
  return size;
}

function drawCaption(ctx, box, frame, caption, subtitle) {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.letterSpacing = '0px';
  const cx = box.x + box.w / 2;
  const hasCaption = Boolean(caption);
  const captionSize = Math.round(box.h * (hasCaption ? 0.42 : 0));
  const subSize = Math.round(box.h * (hasCaption ? 0.2 : 0.28));

  ctx.textBaseline = 'alphabetic';

  if (hasCaption) {
    ctx.fillStyle = frame.ink;
    fitText(ctx, caption, box.w, captionSize, '700');
    ctx.fillText(caption, cx, box.y + box.h * 0.52);
  }
  if (subtitle) {
    ctx.fillStyle = frame.accent;
    fitText(ctx, subtitle, box.w, subSize, '500', 0.12);
    ctx.fillText(subtitle, cx, box.y + box.h * (hasCaption ? 0.88 : 0.62));
  }
  ctx.restore();
}

function drawCutLine(ctx, layout, frame) {
  if (!layout.cutLine) return;
  ctx.save();
  ctx.strokeStyle = frame.accent;
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 12]);
  ctx.beginPath();
  ctx.moveTo(layout.cutLine.x, layout.cutLine.y1 + 20);
  ctx.lineTo(layout.cutLine.x, layout.cutLine.y2 - 20);
  ctx.stroke();
  ctx.restore();
}

/**
 * Compose the whole page.
 * `scale` of 1 renders the real 300 DPI print; the preview uses a fraction.
 */
/** The layout to print for this state — resolving a dynamic grid to real cells,
 *  the chosen sheet orientation, and its paper size. When the guest has picked a
 *  design from the coverflow (state.designKey), that one is used; otherwise the
 *  booth's own auto-best grid. */
function resolveLayout(state) {
  const base = LAYOUTS[state.layoutId];
  if (!base.dynamic) return base;
  if (state.designKey) {
    const chosen = designVariants(base, state.photos).find((d) => d.key === state.designKey);
    if (chosen) return { ...base, ...chosen };
  }
  return { ...base, ...resolveGrid(base, state.photos) };
}

function composePage(canvas, state, scale = 1, layoutOverride = null) {
  const layout = layoutOverride || resolveLayout(state);
  const frame = FRAMES[state.frameId] || FRAMES.white;
  const w = Math.round(layout.page.w * scale);
  const h = Math.round(layout.page.h * scale);

  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }

  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = frame.bg;
  ctx.fillRect(0, 0, w, h);
  ctx.scale(scale, scale);
  ctx.imageSmoothingQuality = 'high';

  for (const cell of layout.cells) {
    const photo = state.photos[cell.photo];
    if (photo && photo.bitmap) drawPhoto(ctx, cell, photo, state.filterId);
    else drawPlaceholder(ctx, cell, cell.photo, frame);
  }

  drawCutLine(ctx, layout, frame);
  for (const box of layout.captions) drawCaption(ctx, box, frame, state.caption, state.subtitle);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  return canvas;
}

// Layouts are described at 300 DPI. We render the PRINT at PRINT_SCALE× that
// (600 DPI) so a capable photo printer gets real detail instead of upscaling a
// 300 DPI image — the difference between a crisp print and a soft, grainy one.
// The on-screen preview stays at its own (smaller) scale, so this costs nothing
// there. Source photos are kept large enough (MAX_SOURCE_DIM) to fill a full-page
// cell at this resolution.
const PRINT_SCALE = 2;

/** Render the print-resolution page and hand back a file ready for the queue.
 *  `rotateForPaper` turns a landscape composition 90° into a portrait bitmap:
 *  4×6 photo paper feeds one way (portrait), and borderless is only offered at
 *  that size, so a wide design must be rotated to fill the sheet or it prints
 *  sideways. The saved-to-phone image is NOT rotated — it keeps its true look. */
async function exportPrint(state, { rotateForPaper = false } = {}) {
  const page = document.createElement('canvas');
  composePage(page, state, PRINT_SCALE);

  let canvas = page;
  if (rotateForPaper && page.width > page.height) {
    canvas = document.createElement('canvas');
    canvas.width = page.height;
    canvas.height = page.width;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(Math.PI / 2); // 90° clockwise: long edge now runs down the 6" side
    ctx.drawImage(page, -page.width / 2, -page.height / 2);
  }

  let blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
  if (!blob) throw new Error('This browser could not render the print.');
  if (blob.size > 3 * 1024 * 1024) {
    // A big PNG crawls over cellular; a 0.95 JPEG is indistinguishable on photo
    // paper and uploads in a second or two.
    const jpeg = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.95));
    if (jpeg) blob = jpeg;
  }
  return { blob, width: canvas.width, height: canvas.height };
}

/** Single photo filling a canvas — used by the crop editor and the slot thumbs. */
function drawSinglePhoto(canvas, photo, filterId = 'none') {
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawPhoto(ctx, { x: 0, y: 0, w: canvas.width, h: canvas.height }, photo, filterId);
  return canvas;
}
